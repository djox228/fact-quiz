<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Тамагочи 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Стабильная версия Three.js с надежного CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0b0d17;color:#fff;user-select:none;padding-bottom:80px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.stage{position:relative;width:100%;height:45vh;min-height:300px;background:linear-gradient(180deg, #1a1e36 0%, #0d0f1a 100%);border-radius:0 0 32px 32px;overflow:hidden;box-shadow:0 15px 35px rgba(0,0,0,.8);transition:background 0.8s;flex-shrink:0}
.stage.night{background:linear-gradient(180deg, #0a0c14 0%, #05060a 100%)}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:2}
.glass{background:rgba(20,24,38,.65);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:8px 12px;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.xp-b{width:110px;height:6px;background:rgba(0,0,0,.5);border-radius:5px;margin-top:5px;overflow:hidden}
.xp-f{height:100%;background:linear-gradient(90deg,#00cec9,#6c5ce7);width:0%;transition:width .4s;box-shadow:0 0 10px #6c5ce7}
.mood{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);background:rgba(15,18,30,.85);backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,.15);padding:6px 16px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;z-index:2;pointer-events:none}
.log{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,.5);white-space:nowrap;z-index:2;pointer-events:none;width:90%;text-align:center;overflow:hidden;text-overflow:ellipsis}
.wrap{max-width:440px;margin:0 auto;padding:12px 14px;flex:1;overflow-y:auto;width:100%}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:linear-gradient(180deg, #1c2138, #131728);padding:10px;border-radius:16px;border:1px solid rgba(255,255,255,.05);box-shadow:0 4px 10px rgba(0,0,0,.3)}
.st-t{display:flex;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:6px;color:#e0e6ed}
.bar{height:8px;background:#090a10;border-radius:8px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.5)}
.fill{height:100%;border-radius:8px;transition:width .4s;box-shadow:0 0 8px currentColor}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.btn{background:linear-gradient(180deg, #252b48, #171a2b);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 4px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:all .1s;box-shadow:0 5px 15px rgba(0,0,0,.4)}
.btn:active{transform:scale(.92);box-shadow:0 2px 5px rgba(0,0,0,.4)}
.btn.on-cd{opacity:.4;pointer-events:none;filter:grayscale(1)}
.btn span:first-child{font-size:24px;filter:drop-shadow(0 4px 4px rgba(0,0,0,0.4))}
.btn span:last-child{font-size:11px;font-weight:800;color:#e0e6ed}
.gold{width:100%;border:none;padding:14px;border-radius:16px;font-size:14px;font-weight:800;background:linear-gradient(135deg,#feca57,#ff9f43);color:#1e272e;cursor:pointer;box-shadow:0 6px 20px rgba(255,159,67,0.3);transition:transform .1s}
.gold:active{transform:scale(.96)}

.tab{display:none}.tab.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.box{background:linear-gradient(180deg, #1c2138, #131728);padding:16px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(255,255,255,.05);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.ttl{font-size:12px;color:#8f9bb3;margin-bottom:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;gap:6px}
.row{display:flex;gap:8px;margin-bottom:12px}
.inp{flex:1;background:#0b0d17;border:1px solid rgba(255,255,255,.1);padding:10px 14px;border-radius:12px;color:#fff;font-size:14px;outline:none;transition:border .2s}
.inp:focus{border-color:#6c5ce7}
.ok{background:#6c5ce7;border:none;color:#fff;padding:0 18px;border-radius:12px;font-weight:800;transition:background .2s}
.cols{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.col{width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid rgba(255,255,255,.2);transition:transform .1s;box-shadow:0 4px 10px rgba(0,0,0,0.4)}
.col:active{transform:scale(.9)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:#0b0d17;padding:12px 8px;border-radius:16px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.05);display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s}
.card.eq{border-color:#6c5ce7;background:#252b48;box-shadow:0 0 15px rgba(108,92,231,0.3)}
.s-btn{background:#6c5ce7;border:none;color:#fff;padding:8px;border-radius:10px;font-size:12px;font-weight:800;width:100%;transition:background .2s}
.s-btn.own{background:#00b894;box-shadow:0 4px 10px rgba(0,184,148,0.3)}
.l-row{display:flex;justify-content:space-between;background:#0b0d17;padding:12px 16px;border-radius:14px;margin-bottom:8px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.03)}
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,23,.95);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:10px 0 16px;border-top:1px solid rgba(255,255,255,.05);z-index:5}
.n-btn{background:none;border:none;color:#7f8fa6;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;transition:color .2s}
.n-btn.active{color:#a29bfe}.n-btn span:first-child{font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5))}

#drag-item { position: fixed; pointer-events: none; font-size: 44px; z-index: 9999; display: none; transform: translate(-50%, -50%); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6)); transition: transform .1s; }
#bubbles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; overflow: hidden; }
.bubble { position: absolute; background: rgba(255,255,255,0.8); border-radius: 50%; box-shadow: inset -2px -2px 6px rgba(0,0,0,0.2); animation: bubbleUp 1s ease-out forwards; }
@keyframes bubbleUp { 0% { transform: scale(0) translateY(0); opacity: 1; } 100% { transform: scale(1.5) translateY(-60px); opacity: 0; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="cv"></canvas>
  <div id="bubbles"></div>
  <div class="hud">
    <div class="glass">
      <div style="font-weight:800;font-size:16px" id="petName">Пушистик</div>
      <div style="font-size:10px;color:#a29bfe;font-weight:800;margin-top:2px" id="stageText">Малыш • 0 / 100 XP</div>
      <div class="xp-b"><div class="xp-f" id="xpBar"></div></div>
    </div>
    <div style="display:flex;gap:8px">
      <div class="glass" style="font-weight:800;font-size:13px;color:#ffeaa7" id="coinsBadge">50 🐾</div>
      <div class="glass" style="font-weight:800;font-size:13px;background:linear-gradient(135deg,#6c5ce7,#a29bfe)" id="levelBadge">Ур. 1</div>
    </div>
  </div>
  <div class="mood" id="moodText">✨ Погладь меня!</div>
  <div class="log" id="lastAction">Загрузка...</div>
</div>

<div id="drag-item">🍖</div>

<div class="wrap">
  <div id="tab-room" class="tab active">
    <div class="stats">
      <div class="stat"><div class="st-t"><span>🍖 Сытость</span><span id="hungerVal">80%</span></div><div class="bar"><div class="fill" id="hungerBar" style="width:80%;background:#00b894;color:#00b894"></div></div></div>
      <div class="stat"><div class="st-t"><span>❤️ Радость</span><span id="happyVal">80%</span></div><div class="bar"><div class="fill" id="happyBar" style="width:80%;background:#ff7675;color:#ff7675"></div></div></div>
      <div class="stat"><div class="st-t"><span>⚡ Энергия</span><span id="energyVal">90%</span></div><div class="bar"><div class="fill" id="energyBar" style="width:90%;background:#fdcb6e;color:#fdcb6e"></div></div></div>
    </div>
    
    <div class="btns">
      <button class="btn" id="btn-feed" ontouchstart="startDrag('feed', '🍖')" onmousedown="startDrag('feed', '🍖')"><span>🍖</span><span id="lbl-feed">Еда</span></button>
      <button class="btn" id="btn-play" onclick="playGame()"><span>🎾</span><span id="lbl-play">Играть</span></button>
      <button class="btn" id="btn-wash" onclick="toggleWash()"><span>🧽</span><span id="lbl-wash">Мыть</span></button>
      <button class="btn" id="btn-sleep" onclick="act('sleep')"><span id="sleepIcon">💤</span><span id="sleepLabel">Спать</span></button>
    </div>
    <button class="gold" onclick="watchAd()">✨ Золотой корм (+100% статов и +50 🐾)</button>
  </div>
  
  <div id="tab-shop" class="tab">
    <div class="box"><div class="ttl">🛋️ Мебель в комнату</div><div class="grid">
      <div class="card"><span style="font-size:24px">🌿</span><b>Монстера</b><button class="s-btn" id="shop-plant" data-price="50" onclick="act('buy',{itemId:'plant'})">50 🐾</button></div>
      <div class="card"><span style="font-size:24px">💡</span><b>Ночник</b><button class="s-btn" id="shop-lamp" data-price="80" onclick="act('buy',{itemId:'lamp'})">80 🐾</button></div>
      <div class="card"><span style="font-size:24px">🛏️</span><b>Кроватка</b><button class="s-btn" id="shop-bed" data-price="150" onclick="act('buy',{itemId:'bed'})">150 🐾</button></div>
      <div class="card"><span style="font-size:24px">🪟</span><b>Окно</b><button class="s-btn" id="shop-window" data-price="200" onclick="act('buy',{itemId:'window'})">200 🐾</button></div>
    </div></div>
    <div class="box"><div class="ttl">🎩 Аксессуары</div><div class="grid">
      <div class="card"><span style="font-size:24px">🧣</span><b>Шарф</b><button class="s-btn" id="shop-scarf" data-price="120" onclick="act('buy',{itemId:'scarf'})">120 🐾</button></div>
      <div class="card"><span style="font-size:24px">😇</span><b>Нимб</b><button class="s-btn" id="shop-halo" data-price="200" onclick="act('buy',{itemId:'halo'})">200 🐾</button></div>
      <div class="card"><span style="font-size:24px">🎩</span><b>Цилиндр</b><button class="s-btn" id="shop-tophat" data-price="250" onclick="act('buy',{itemId:'tophat'})">250 🐾</button></div>
      <div class="card"><span style="font-size:24px">🦋</span><b>Крылья</b><button class="s-btn" id="shop-wings" data-price="300" onclick="act('buy',{itemId:'wings'})">300 🐾</button></div>
      <div class="card"><span style="font-size:24px">🥸</span><b>Усы</b><button class="s-btn" id="shop-stache" data-price="100" onclick="act('buy',{itemId:'stache'})">100 🐾</button></div>
    </div></div>
  </div>

  <div id="tab-wardrobe" class="tab">
    <div class="box">
      <div class="ttl">✏️ Имя</div>
      <div class="row"><input id="nameInput" class="inp" placeholder="Новое имя..." maxlength="18"><button class="ok" onclick="saveName()">ОК</button></div>
      <div class="ttl">🎨 Цвет</div>
      <div class="cols">
        <div class="col" style="background:#f368e0" onclick="act('customize',{color:'pink'})"></div>
        <div class="col" style="background:#00b894" onclick="act('customize',{color:'mint'})"></div>
        <div class="col" style="background:#0984e3" onclick="act('customize',{color:'sky'})"></div>
        <div class="col" style="background:#fdcb6e" onclick="act('customize',{color:'gold'})"></div>
        <div class="col" style="background:#6c5ce7" onclick="act('customize',{color:'cyber'})"></div>
      </div>
      <div class="ttl">👑 Аксессуары</div>
      <div class="grid" id="wardrobe-grid"></div>
    </div>
    <button class="gold" style="background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;margin-top:10px;font-size:13px" onclick="act('dev_coins')">🧪 [DEV] Получить 1000 Монет</button>
  </div>
  
  <div id="tab-top" class="tab">
    <div class="box"><div class="ttl">👤 Ваш ник</div><div class="row" style="margin:0"><input id="nickInput" class="inp" placeholder="Ваш ник..." maxlength="18"><button class="ok" onclick="saveNick()">ОК</button></div></div>
    <div class="box"><div class="ttl">🏆 Топ игроков</div><div id="leaderboardList"><div class="l-row"><span>Пока пусто</span><span>0 XP</span></div></div></div>
  </div>
</div>
<div class="nav">
  <button class="n-btn active" onclick="tab('room',this)"><span>🏠</span><span>Мир</span></button>
  <button class="n-btn" onclick="tab('shop',this)"><span>🛍️</span><span>Магазин</span></button>
  <button class="n-btn" onclick="tab('wardrobe',this)"><span>🎨</span><span>Стиль</span></button>
  <button class="n-btn" onclick="tab('top',this)"><span>🏆</span><span>Топ</span></button>
</div>

<script>
const API = "https://tamagotchi-bot.djogrinder22.workers.dev/api/pet";
const tg = window.Telegram?.WebApp || null;
if (tg) { tg.ready(); tg.expand(); }
const qp = new URLSearchParams(location.search);

const haptic = (type = 'light') => { if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred(type); };
const notify = (type = 'success') => { if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred(type); };

function getUser() {
  if (tg?.initDataUnsafe?.user) {
    const u = tg.initDataUnsafe.user;
    const n = u.first_name + (u.last_name ? " " + u.last_name : "");
    localStorage.setItem("tama_uid", String(u.id));
    if (!localStorage.getItem("tama_nick")) localStorage.setItem("tama_nick", n);
    return { id: String(u.id), name: localStorage.getItem("tama_nick") || n };
  }
  let id = localStorage.getItem("tama_uid");
  if (!id) { id = "u_" + Math.floor(Math.random() * 90000 + 10000); localStorage.setItem("tama_uid", id); }
  return { id, name: localStorage.getItem("tama_nick") || "Игрок" };
}
const me = getUser();
const sp = tg?.initDataUnsafe?.start_param;
const chatId = qp.get("chat_id") || (sp ? sp.replace("chat_", "") : null) || me.id || "demo";

const PALETTES = {
  pink:  { a: 0xff9ff3, b: 0xc44569 }, mint:  { a: 0x55efc4, b: 0x009432 },
  sky:   { a: 0x74b9ff, b: 0x0652DD }, gold:  { a: 0xffeaa7, b: 0xe17055 },
  cyber: { a: 0xa29bfe, b: 0x4834d4 }
};
const CD = { feed: 60000, play: 120000, wash: 180000 };
const LBL = { feed: "Еда", play: "Играть", wash: "Мыть" };

let pet = { name:"Пушистик", level:1, xp:0, coins:50, hunger:80, happiness:80, energy:90, color:"pink", accessories:[], inventory:[], isSleeping:false, lastActionBy:"Готов к игре!" };
let userCd = {};
const OWNED_KEY = "tama_owned_" + chatId + "_" + me.id;

function getOwnedFallback() { try { return JSON.parse(localStorage.getItem(OWNED_KEY) || "[]"); } catch { return []; } }
function setOwnedFallback(arr) { localStorage.setItem(OWNED_KEY, JSON.stringify(arr)); }
function markOwned(id) { const arr = getOwnedFallback(); if (!arr.includes(id)) { arr.push(id); setOwnedFallback(arr); } }
function getMergedOwned(p) { const merged = Array.from(new Set([...(p?.inventory||[]), ...getOwnedFallback()])); setOwnedFallback(merged); return merged; }

let scene, camera, renderer, petScaleGroup, petGroup, bodyMat, earMat, eyeL, eyeR;
let crown, glasses, scarf, tophat, wings, stache, bowGroup;
let plantGroup, lampGroup, bedGroup, fancyWindow, baseWindow, lLight;
let isWashMode = false, jumpVel = 0, jumpY = 0, targetRotY = 0, currentRotY = 0;

function init3D() {
  if (typeof THREE === 'undefined') return;
  try {
    const canvas = document.getElementById("cv");
    const stageEl = document.getElementById("stage");
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.set(0, 1.5, 5.4); camera.lookAt(0, 0.15, 0);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 0.6));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(3, 6, 4); keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024); keyLight.shadow.bias = -0.001;
    scene.add(keyLight);
    const rimLight = new THREE.DirectionalLight(0x6c5ce7, 1.5); rimLight.position.set(-4, 3, -3); scene.add(rimLight);

    const roomGroup = new THREE.Group(); scene.add(roomGroup);
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x1a1e36, roughness: 0.9, side: THREE.DoubleSide });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(15, 10), wallMat); backWall.position.set(0, 2, -3); roomGroup.add(backWall);
    const leftWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), wallMat); leftWall.rotation.y = Math.PI / 2; leftWall.position.set(-5, 2, 2); roomGroup.add(leftWall);
    const rightWall = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), wallMat); rightWall.rotation.y = -Math.PI / 2; rightWall.position.set(5, 2, 2); roomGroup.add(rightWall);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(15, 15), new THREE.MeshStandardMaterial({ color: 0x0d0f1a, roughness: 0.8 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -1.2; floor.receiveShadow = true; roomGroup.add(floor);

    const rug = new THREE.Mesh(new THREE.CircleGeometry(2.5, 64), new THREE.MeshStandardMaterial({ color: 0x2d2350, roughness: 1 }));
    rug.rotation.x = -Math.PI / 2; rug.position.y = -1.19; rug.receiveShadow = true; roomGroup.add(rug);
    const rugRing = new THREE.Mesh(new THREE.RingGeometry(2.0, 2.2, 64), new THREE.MeshBasicMaterial({ color: 0x6c5ce7, side: THREE.DoubleSide, transparent: true, opacity: 0.5 }));
    rugRing.rotation.x = -Math.PI / 2; rugRing.position.y = -1.185; roomGroup.add(rugRing);

    baseWindow = new THREE.Group();
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2f4a, metalness: 0.2 });
    const bTop = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.15, 0.15), frameMat); bTop.position.y = 0.85;
    const bBot = bTop.clone(); bBot.position.y = -0.85;
    const bL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1.7, 0.15), frameMat); bL.position.x = -1.3;
    const bR = bL.clone(); bR.position.x = 1.3;
    baseWindow.add(bTop, bBot, bL, bR);
    const winSky = new THREE.Mesh(new THREE.PlaneGeometry(2.5, 1.6), new THREE.MeshBasicMaterial({ color: 0x0f1428 }));
    winSky.position.z = -0.05; baseWindow.add(winSky);
    baseWindow.position.set(0, 1.6, -2.95); roomGroup.add(baseWindow);

    const moon = new THREE.Mesh(new THREE.CircleGeometry(0.15, 32), new THREE.MeshBasicMaterial({ color: 0xffeaa7 }));
    moon.position.set(0.6, 1.9, -2.9); roomGroup.add(moon);

    plantGroup = new THREE.Group();
    const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.16, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0x8b4513 }));
    pot.position.y = -1.05; plantGroup.add(pot);
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x27ae60 });
    for (let i = 0; i < 6; i++) {
      const leaf = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 16), leafMat);
      leaf.position.set(Math.cos(i)*0.13, -0.5 + Math.random()*0.12, Math.sin(i)*0.13);
      leaf.scale.set(0.9, 1.35, 0.9); plantGroup.add(leaf);
    }
    plantGroup.position.set(-1.95, 0, -0.6); plantGroup.visible = false; roomGroup.add(plantGroup);

    lampGroup = new THREE.Group();
    const lBase = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 0.2, 16), new THREE.MeshStandardMaterial({ color: 0x333 })); lBase.position.y = -1.0;
    const lShade = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.3, 16), new THREE.MeshStandardMaterial({ color: 0xffeaa7, emissive: 0xffeaa7, emissiveIntensity: 0.6 })); lShade.position.y = -0.8;
    lLight = new THREE.PointLight(0xffeaa7, 1.5, 4); lLight.position.y = -0.8;
    lampGroup.add(lBase, lShade, lLight);
    lampGroup.position.set(1.8, 0, -1.2); lampGroup.visible = false; roomGroup.add(lampGroup);

    bedGroup = new THREE.Group();
    const bedBase = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.3, 0.9), new THREE.MeshStandardMaterial({ color: 0x6c5ce7 })); bedBase.position.set(0, -0.9, -1.2); bedBase.castShadow = true; bedGroup.add(bedBase);
    const pillow = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.7), new THREE.MeshStandardMaterial({ color: 0xffffff })); pillow.position.set(-0.55, -0.7, -1.2); bedGroup.add(pillow);
    bedGroup.visible = false; roomGroup.add(bedGroup);

    fancyWindow = new THREE.Group();
    const fTop = new THREE.Mesh(new THREE.BoxGeometry(3.0, 0.2, 0.2), new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.8 })); fTop.position.y = 1.0;
    const fBot = fTop.clone(); fBot.position.y = -1.0;
    const fL = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.0, 0.2), new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.8 })); fL.position.x = -1.5;
    const fR = fL.clone(); fR.position.x = 1.5;
    fancyWindow.add(fTop, fBot, fL, fR);
    fancyWindow.position.set(0, 1.6, -2.95); fancyWindow.visible = false; roomGroup.add(fancyWindow);

    petScaleGroup = new THREE.Group(); petGroup = new THREE.Group();
    petScaleGroup.add(petGroup); scene.add(petScaleGroup);

    bodyMat = new THREE.MeshPhysicalMaterial({ color: PALETTES.pink.a, roughness: 0.35, clearcoat: 0.9 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(1, 64, 64), bodyMat); body.castShadow = true; petGroup.add(body);

    earMat = new THREE.MeshPhysicalMaterial({ color: PALETTES.pink.b, roughness: 0.4 });
    const earL = new THREE.Mesh(new THREE.SphereGeometry(0.3, 32, 32), earMat); earL.position.set(-0.55, 0.88, 0); earL.scale.set(1, 1.4, 0.65); earL.rotation.z = 0.15; petGroup.add(earL);
    const earR = earL.clone(); earR.position.x = 0.55; earR.rotation.z = -0.15; petGroup.add(earR);

    const eyeMat = new THREE.MeshPhysicalMaterial({ color: 0x0f1118, roughness: 0.05 });
    eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 32, 32), eyeMat); eyeL.position.set(-0.32, 0.2, 0.92); petGroup.add(eyeL);
    eyeR = eyeL.clone(); eyeR.position.x = 0.32; petGroup.add(eyeR);

    const blushMat = new THREE.MeshBasicMaterial({ color: 0xff6b81, transparent: true, opacity: 0.55 });
    const blushL = new THREE.Mesh(new THREE.CircleGeometry(0.13, 32), blushMat); blushL.position.set(-0.5, -0.06, 0.85); blushL.rotation.y = -0.4; petGroup.add(blushL);
    const blushR = blushL.clone(); blushR.position.x = 0.5; blushR.rotation.y = 0.4; petGroup.add(blushR);

    const accGroup = new THREE.Group(); petGroup.add(accGroup);

    crown = new THREE.Group();
    const crownMat = new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.75 });
    const cb = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.32, 0.1, 16), crownMat); cb.position.y = 1.18; crown.add(cb);
    for(let i=0; i<5; i++){ const sp = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.2, 8), crownMat); sp.position.set(Math.cos(i)*0.22, 1.31, Math.sin(i)*0.22); crown.add(sp); }
    crown.visible = false; accGroup.add(crown);

    glasses = new THREE.Group();
    const glassFrame = new THREE.MeshStandardMaterial({ color: 0xffd32a, metalness: 0.9 });
    const glassMat = new THREE.MeshPhysicalMaterial({ color: 0x74b9ff, transparent: true, opacity: 0.4 });
    const fLens = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.03, 12, 32), glassFrame); fLens.position.set(-0.32, 0.2, 0.98);
    const fR = fLens.clone(); fR.position.x = 0.32;
    const gLens = new THREE.Mesh(new THREE.CircleGeometry(0.16, 32), glassMat); gLens.position.set(-0.32, 0.2, 0.985);
    const gR = gLens.clone(); gR.position.x = 0.32;
    glasses.add(fLens, fR, gLens, gR); glasses.visible = false; accGroup.add(glasses);

    scarf = new THREE.Group();
    const scarfMat = new THREE.MeshPhysicalMaterial({ color: 0x00b894, roughness: 0.6 });
    const wrap = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.15, 16, 48), scarfMat); wrap.rotation.x = Math.PI/2; wrap.position.y = -0.5; wrap.scale.set(1,1,0.65);
    const knot = new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), scarfMat); knot.position.set(0, -0.5, 0.72);
    const t1 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.42, 0.06), scarfMat); t1.position.set(-0.09, -0.78, 0.72); t1.rotation.z = 0.12;
    const t2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.34, 0.06), scarfMat); t2.position.set(0.11, -0.75, 0.73); t2.rotation.z = -0.18;
    scarf.add(wrap, knot, t1, t2); scarf.visible = false; accGroup.add(scarf);

    tophat = new THREE.Group();
    const hatMat = new THREE.MeshStandardMaterial({ color: 0x111, roughness: 0.4 });
    const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32), hatMat); brim.position.y = 1.05;
    const top = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.6, 32), hatMat); top.position.y = 1.35;
    tophat.add(brim, top); tophat.visible = false; accGroup.add(tophat);

    wings = new THREE.Group();
    const wingMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, side: THREE.DoubleSide });
    const wL = new THREE.Mesh(new THREE.CircleGeometry(0.4, 32), wingMat); wL.position.set(-0.8, 0, -0.5); wL.rotation.y = 0.5;
    const wR = wL.clone(); wR.position.x = 0.8; wR.rotation.y = -0.5;
    wings.add(wL, wR); wings.visible = false; accGroup.add(wings);

    stache = new THREE.Group();
    const stacheMat = new THREE.MeshStandardMaterial({ color: 0x111 });
    const sL = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 8, 16, Math.PI), stacheMat); sL.position.set(-0.08, -0.1, 0.98); sL.rotation.z = Math.PI;
    const sR = sL.clone(); sR.position.x = 0.08;
    stache.add(sL, sR); stache.visible = false; accGroup.add(stache);

    bowGroup = new THREE.Group();
    const bowMat = new THREE.MeshPhysicalMaterial({ color: 0xff4757, roughness: 0.4 });
    const bc = new THREE.Mesh(new THREE.SphereGeometry(0.07, 16, 16), bowMat);
    const bL = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), bowMat); bL.position.x = -0.12; bL.scale.set(1, 1.4, 0.6);
    const bR = bL.clone(); bR.position.x = 0.12;
    bowGroup.add(bc, bL, bR); bowGroup.position.set(0, 0.62, 0.55); bowGroup.visible = false; accGroup.add(bowGroup);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05); const t = clock.getElapsedTime();

      const targetSize = Math.min(1.4, 0.75 + (pet.level || 1) * 0.07);
      petScaleGroup.scale.lerp(new THREE.Vector3(targetSize, targetSize, targetSize), 0.1);
      petScaleGroup.position.y = targetSize - 1.2;

      const breathe = 1 + Math.sin(t * 1.6) * 0.015;
      petGroup.scale.set(breathe, 1 / breathe, breathe);

      jumpY += jumpVel; jumpVel -= 0.006;
      if (jumpY <= 0) { jumpY = 0; jumpVel = 0; }
      petGroup.position.y = Math.sin(t * 1.6) * 0.035 + jumpY;

      currentRotY += (targetRotY - currentRotY) * 0.15;
      petGroup.rotation.y = currentRotY;

      if (pet.isSleeping) { eyeL.scale.y = 0.1; eyeR.scale.y = 0.1; } 
      else { eyeL.scale.y = 1; eyeR.scale.y = 1; }

      if(wings.visible) { wL.rotation.y = 0.5 + Math.sin(t*10)*0.2; wR.rotation.y = -0.5 - Math.sin(t*10)*0.2; }
      if(lampGroup.visible) lLight.intensity = 1.2 + Math.sin(t*5)*0.3;

      renderer.render(scene, camera);
    }

    function resize3D() {
      const r = stageEl.getBoundingClientRect();
      if (r.width > 0 && r.height > 0) {
        renderer.setSize(r.width, r.height, false);
        camera.aspect = r.width / r.height;
        camera.updateProjectionMatrix();
      }
    }
    window.addEventListener("resize", resize3D); setTimeout(resize3D, 100); resize3D();
    
    const canvasEl = document.getElementById("cv");
    let isDragging = false, lastPointerX = 0;
    canvasEl.addEventListener("pointerdown", (e) => {
      if (isWashMode) return;
      isDragging = true; lastPointerX = e.clientX;
      if (jumpY === 0) jumpVel = 0.08;
    });
    // Исправлена ошибка с кавычкой
    window.addEventListener("pointerup", () => { isDragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - lastPointerX; lastPointerX = e.clientX;
      targetRotY += dx * 0.008;
    });

    window.updatePet3D = function(p) {
      if (!bodyMat) return;
      const pal = PALETTES[p.color] || PALETTES.pink;
      bodyMat.color.setHex(pal.a); earMat.color.setHex(pal.b);

      crown.visible = p.accessories.includes("crown");
      glasses.visible = p.accessories.includes("glasses");
      scarf.visible = p.accessories.includes("scarf");
      tophat.visible = p.accessories.includes("tophat");
      wings.visible = p.accessories.includes("wings");
      stache.visible = p.accessories.includes("stache");
      bowGroup.visible = p.accessories.includes("bow");

      const owned = getMergedOwned(p);
      plantGroup.visible = owned.includes("plant");
      lampGroup.visible = owned.includes("lamp");
      bedGroup.visible = owned.includes("bed");
      fancyWindow.visible = owned.includes("window");
      if(fancyWindow.visible) baseWindow.visible = false; else baseWindow.visible = true;
    };

    setTimeout(() => { animate(); window.updatePet3D(pet); }, 100);
    
  } catch (e) {
    console.error("Ошибка 3D:", e);
    document.getElementById("lastAction").innerText = "Ошибка 3D: " + e.message;
  }
}

window.tab = function (t, b) {
  document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
  document.querySelectorAll(".n-btn").forEach(x => x.classList.remove("active"));
  document.getElementById("tab-" + t).classList.add("active");
  b.classList.add("active"); haptic('light');
};

const dragItem = document.getElementById('drag-item');
let currentDragAction = null;

window.startDrag = function(action, icon) {
  if (isWashMode) return window.toggleWash();
  haptic('light');
  currentDragAction = action;
  dragItem.innerText = icon;
  dragItem.style.display = 'block';
};

window.addEventListener('pointermove', (e) => {
  if (currentDragAction) {
    dragItem.style.left = e.clientX + 'px';
    dragItem.style.top = e.clientY + 'px';
  } else if (isWashMode) {
    if (Math.random() > 0.5) window.createBubble(e.clientX, e.clientY);
  }
});

window.addEventListener('pointerup', (e) => {
  if (currentDragAction) {
    dragItem.style.display = 'none';
    const rect = document.getElementById("stage").getBoundingClientRect();
    if (e.clientY < rect.bottom && e.clientX > rect.left && e.clientX < rect.right) {
      window.act(currentDragAction);
      jumpVel = 0.1;
      window.spawnHearts();
    }
    currentDragAction = null;
  }
});

window.playGame = function() {
  if (isWashMode) window.toggleWash();
  haptic('medium'); jumpVel = 0.15; window.act('play');
};

window.toggleWash = function() {
  isWashMode = !isWashMode;
  const btn = document.getElementById('btn-wash');
  if (isWashMode) {
    btn.style.background = 'linear-gradient(180deg, #00b894, #009432)';
    document.getElementById('moodText').innerText = "🧽 Води пальцем!";
  } else {
    btn.style.background = '';
    document.getElementById('moodText').innerText = "✨ Погладь меня!";
    window.act('wash');
  }
};

window.createBubble = function(x, y) {
  const b = document.createElement('div'); b.className = 'bubble';
  const size = Math.random() * 20 + 10;
  b.style.width = size + 'px'; b.style.height = size + 'px';
  const rect = document.getElementById("stage").getBoundingClientRect();
  b.style.left = (x - rect.left) + 'px'; b.style.top = (y - rect.top) + 'px';
  document.getElementById('bubbles').appendChild(b);
  setTimeout(() => b.remove(), 1000);
};

window.spawnHearts = function() {
  haptic('success');
  const stage = document.getElementById("stage");
  for(let i=0; i<5; i++){
    const h = document.createElement('div');
    h.innerText = "❤️"; h.style.position = 'absolute'; h.style.fontSize = '24px';
    h.style.left = (50 + (Math.random()-0.5)*20) + '%'; h.style.top = '40%';
    h.style.transition = 'all 1s'; h.style.pointerEvents = 'none'; h.style.zIndex = 100;
    stage.appendChild(h);
    setTimeout(() => { h.style.transform = `translateY(-50px) scale(1.5)`; h.style.opacity = 0; }, 10);
    setTimeout(() => h.remove(), 1000);
  }
};

window.watchAd = function() {
  if (window.Adsgram) {
    window.Adsgram.init({ blockId: "56776" }).show().then(() => window.act("golden_feed")).catch(() => tg?.showAlert?.("Реклама недоступна"));
  } else {
    window.act("golden_feed");
  }
};

window.saveName = function () { const v = document.getElementById("nameInput").value.trim(); if (v) { window.act("customize", { name: v }); document.getElementById("nameInput").value = ""; window.tab('room', document.querySelector('.n-btn')); } };
window.saveNick = function () { const v = document.getElementById("nickInput").value.trim(); if (v) { localStorage.setItem("tama_nick", v); me.name = v; document.getElementById("nickInput").value = ""; window.act("ping"); } };

async function load() {
  try {
    document.getElementById("lastAction").innerText = "Синхронизация...";
    const r = await fetch(API + "?chat_id=" + chatId + "&user_id=" + me.id);
    const d = await r.json();
    if (d.userCd) userCd = d.userCd;
    if (d.pet) {
      sync(d.pet);
      document.getElementById("lastAction").innerText = d.pet.lastActionBy;
    } else {
      document.getElementById("lastAction").innerText = "Ошибка: сервер не вернул данные";
    }
  } catch (e) { 
    console.warn("Load error:", e); 
    document.getElementById("lastAction").innerText = "Ошибка API: проверь воркер";
  }
}

window.act = async function (a, ex) {
  try {
    const r = await fetch(API + "?chat_id=" + chatId, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ action: a, userId: me.id, userName: me.name }, ex || {}))
    });
    const d = await r.json();
    if (d.userCd) userCd = d.userCd;
    if (!d.ok && d.message) tg?.showAlert?.(d.message);
    if (d.ok && a === "buy" && ex?.itemId) { markOwned(ex.itemId); notify('success'); }
    if (d.ok && a === "dev_coins") notify('warning');
    if (d.pet) sync(d.pet);
  } catch (e) { 
    console.warn("Act error:", e);
    tg?.showAlert?.("Ошибка сети");
  }
};

function sync(p) {
  pet = p;
  document.getElementById("petName").innerText = p.name;
  document.getElementById("levelBadge").innerText = "Ур. " + p.level;
  document.getElementById("coinsBadge").innerText = (p.coins || 0) + " 🐾";
  const need = p.level * 100;
  document.getElementById("stageText").innerText = (p.level >= 8 ? "Легенда 👑" : p.level >= 5 ? "Хранитель ✨" : "Малыш 🥚") + " • " + p.xp + " / " + need + " XP";
  document.getElementById("xpBar").style.width = Math.min(100, (p.xp / need) * 100) + "%";
  document.getElementById("lastAction").innerText = p.lastActionBy;
  document.getElementById("hungerVal").innerText = p.hunger + "%"; document.getElementById("hungerBar").style.width = p.hunger + "%";
  document.getElementById("happyVal").innerText = p.happiness + "%"; document.getElementById("happyBar").style.width = p.happiness + "%";
  document.getElementById("energyVal").innerText = p.energy + "%"; document.getElementById("energyBar").style.width = p.energy + "%";

  const owned = getMergedOwned(p);

  ["plant","lamp","bed","window","scarf","halo","tophat","wings","stache"].forEach(id => {
    const btn = document.getElementById("shop-" + id);
    if (btn) {
      if (owned.includes(id)) { btn.innerText = "Куплено ✅"; btn.classList.add("own"); }
      else { btn.innerText = (btn.dataset.price || "?") + " 🐾"; btn.classList.remove("own"); }
    }
  });

  const wGrid = document.getElementById("wardrobe-grid");
  const accs = [
    { id:'crown', icon:'👑', name:'Корона' }, { id:'glasses', icon:'🕶️', name:'Очки' }, { id:'bow', icon:'🎀', name:'Бантик' },
    { id:'scarf', icon:'🧣', name:'Шарф' }, { id:'halo', icon:'😇', name:'Нимб' }, { id:'tophat', icon:'🎩', name:'Цилиндр' },
    { id:'wings', icon:'🦋', name:'Крылья' }, { id:'stache', icon:'🥸', name:'Усы' }
  ];
  wGrid.innerHTML = "";
  accs.forEach(a => {
    if (["scarf","halo","tophat","wings","stache"].includes(a.id) && !owned.includes(a.id)) return;
    const div = document.createElement("div");
    div.className = "card" + (p.accessories.includes(a.id) ? " eq" : "");
    div.innerHTML = `<span style="font-size:24px">${a.icon}</span><b>${a.name}</b>`;
    div.onclick = () => window.act('customize', { toggleAcc: a.id });
    wGrid.appendChild(div);
  });

  if (p.isSleeping) {
    document.getElementById("stage").classList.add("night");
    document.getElementById("sleepIcon").innerText = "☀️";
    document.getElementById("sleepLabel").innerText = "Разбудить";
    document.getElementById("moodText").innerText = "💤 Спит...";
  } else {
    document.getElementById("stage").classList.remove("night");
    document.getElementById("sleepIcon").innerText = "💤";
    document.getElementById("sleepLabel").innerText = "Спать";
    if (!isWashMode) document.getElementById("moodText").innerText = "✨ Погладь меня!";
  }

  const lst = document.getElementById("leaderboardList");
  const arr = Object.values(p.leaderboard || {}).sort((a, b) => b.score - a.score);
  if (arr.length) {
    lst.innerHTML = "";
    arr.forEach((it, i) => {
      const row = document.createElement("div"); row.className = "l-row";
      row.innerHTML = `<span>${(i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : "🐾 ")}${it.name}</span><span style="color:#a29bfe">${it.score} XP</span>`;
      lst.appendChild(row);
    });
  }

  if (window.updatePet3D) window.updatePet3D(p);
}

setInterval(() => {
  const n = Date.now();
  ["feed", "play", "wash"].forEach(k => {
    const b = document.getElementById("btn-" + k), l = document.getElementById("lbl-" + k);
    if (!b || !l) return;
    const lf = (userCd[k] || 0) + CD[k] - n;
    if (lf > 0) {
      b.classList.add("on-cd");
      const m = Math.floor(lf / 60000), s = Math.floor((lf % 60000) / 1000);
      l.innerText = m > 0 ? `${m}м ${s}с` : `${s}с`;
    } else { b.classList.remove("on-cd"); l.innerText = LBL[k]; }
  });
}, 1000);

window.onload = () => {
  init3D();
  load();
};
</script>
