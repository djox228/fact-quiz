},
{

{

),
correct: 0,

var bank = parseInt(localStorage.getItem('int_bank') || '1000', 10);
var streak = parseInt(localStorage.getItem('int_streak') || '0', 10);
var seenIds = new Array();
try {
var saved = JSON.parse(localStorage.getItem('int_seen') || '[]');
if (Array.isArray(saved)) seenIds = saved;
} catch (e) {}
var currentBetType = '100';
var currentSit = null;
var isAnswered = false;
var bankTxt = document.getElementById('bank-txt');
var rankTxt = document.getElementById('rank-txt');
var streakTxt = document.getElementById('streak-txt');
var catTxt = document.getElementById('cat-txt');
var multTxt = document.getElementById('mult-txt');
var sitTxt = document.getElementById('sit-txt');
var optionsBox = document.getElementById('options-box');
var resModal = document.getElementById('res-modal');
var resBadge = document.getElementById('res-badge');
var resMoney = document.getElementById('res-money');
var crowdPct = document.getElementById('crowd-pct');
var barWin = document.getElementById('bar-win');
var barLose = document.getElementById('bar-lose');
var outcomeTxt = document.getElementById('outcome-txt');
var adRefillBtn = document.getElementById('ad-refill-btn');
var nextBtn = document.getElementById('next-btn');
function updateStatsUI() {
bankTxt.innerText = bank;
streakTxt.innerText = streak;
var rank = 'Новичок';
if (bank >= 25000) rank = 'Оракул 🔮';
else if (bank >= 10000) rank = 'Провидец ⚡';
else if (bank >= 4000) rank = 'Мастер 🧠';
else if (bank >= 2000) rank = 'Знаток 🎯';
rankTxt.innerText = rank;
try {
localStorage.setItem('int_bank', bank);
localStorage.setItem('int_streak', streak);
} catch (e) {}
}
updateStatsUI();
function saveSeen(id) {
if (seenIds.indexOf(id) === -1) {
seenIds.push(id);
try { localStorage.setItem('int_seen', JSON.stringify(seenIds)); } catch (e) {}
if (tg && tg.CloudStorage) {
try { tg.CloudStorage.setItem('int_seen_v1', seenIds.join(',')); } catch (e) {}
}
}
}
function getBetAmount() {
if (bank <= 0) return 0;
if (currentBetType === 'all') return bank;
var val = parseInt(currentBetType, 10);
return Math.min(bank, val);
}
var betBtns = document.querySelectorAll('.bet-btn');
for (var b = 0; b < betBtns.length; b++) {
(function(btn) {
btn.addEventListener('click', function() {
for (var x = 0; x < betBtns.length; x++) betBtns[x].classList.remove('active');
btn.classList.add('active');
currentBetType = btn.getAttribute('data-bet');
haptic('light');
});
})(betBtns[b]);
}
function loadSituation() {
isAnswered = false;
var unseen = situations.filter(function(s) { return seenIds.indexOf(s.id) === -1; });
if (unseen.length === 0) {
seenIds = new Array();
try { localStorage.setItem('int_seen', '[]'); } catch (e) {}
unseen = situations.slice();
}
currentSit = unseen[Math.floor(Math.random() * unseen.length)];
saveSeen(currentSit.id);
catTxt.innerText = currentSit.cat;
multTxt.innerText = 'Коэф: x' + currentSit.mult.toFixed(1);
sitTxt.innerText = currentSit.text;
var indices = new Array(0, 1, 2);
for (var i = indices.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var t = indices[i]; indices[i] = indices[j]; indices[j] = t;
}
optionsBox.innerHTML = '';
var letters = new Array('А', 'Б', 'В');
for (var k = 0; k < indices.length; k++) {
var origIdx = indices[k];
var btn = document.createElement('button');
btn.className = 'opt-btn';
btn.innerHTML = '' + letters[k] + '' + currentSit.opts[origIdx] + '';
(function(selectedOrigIdx) {
btn.addEventListener('click', function() { checkAnswer(selectedOrigIdx); });
})(origIdx);
optionsBox.appendChild(btn);
}
}
function checkAnswer(selectedOrigIdx) {
if (isAnswered) return;
isAnswered = true;
var bet = getBetAmount();
var isWin = (selectedOrigIdx === currentSit.correct);
if (isWin) {
var profit = Math.round(bet * (currentSit.mult - 1));
if (bet === 0) profit = 100;
bank += profit;
streak++;
resBadge.className = 'res-badge res-win';
resBadge.innerText = 'ИНТУИЦИЯ В ТОЧКУ!';
resMoney.style.color = '#4ade80';
resMoney.innerText = '+' + profit + ' 💰';
haptic('success');
} else {
bank = Math.max(0, bank - bet);
streak = 0;
resBadge.className = 'res-badge res-lose';
resBadge.innerText = 'ПОПАЛСЯ НА УЛОВКУ!';
resMoney.style.color = '#f87171';
resMoney.innerText = bet > 0 ? ('-' + bet + ' 💰') : '0 💰';
haptic('error');
}
updateStatsUI();
crowdPct.innerText = 'Только ' + currentSit.winPct + '% угадали';
barWin.style.width = currentSit.winPct + '%';
barLose.style.width = (100 - currentSit.winPct) + '%';
outcomeTxt.innerText = currentSit.outcome;
if (bank < 100) {
adRefillBtn.style.display = 'block';
} else {
adRefillBtn.style.display = 'none';
}
resModal.style.display = 'flex';
}
nextBtn.addEventListener('click', function() {
resModal.style.display = 'none';
loadSituation();
});
document.getElementById('share-btn').addEventListener('click', function() {
if (!currentSit) return;
var txt = 'Ситуация: ' + currentSit.text.slice(0, 95) + '... Только ' + currentSit.winPct + '% людей угадывают финал! Проверь свою интуицию: @reaction_duel_1v1_bot';
if (tg && tg.switchInlineQuery) {
try {
tg.switchInlineQuery(txt, new Array('users', 'groups', 'channels'));
return;
} catch (e) {}
}
window.open('t.me' + encodeURIComponent('t.me') + '&text=' + encodeURIComponent(txt), '_blank');
});
adRefillBtn.addEventListener('click', function() {
adRefillBtn.disabled = true;
adRefillBtn.innerText = 'Загрузка рекламы...';
initAds();
if (!AdController) {
adRefillBtn.disabled = false;
adRefillBtn.innerText = 'Реклама пока недоступна';
return;
}
AdController.show().then(function() {
bank += 1000;
updateStatsUI();
adRefillBtn.disabled = false;
adRefillBtn.style.display = 'none';
haptic('success');
}).catch(function() {
adRefillBtn.disabled = false;
adRefillBtn.innerText = 'Нет роликов (повторить)';
});
});
// Мгновенный запуск + фоновая синхронизация с облаком
loadSituation();
if (tg && tg.CloudStorage) {
try {
tg.CloudStorage.getItem('int_seen_v1', function(err, val) {
if (!err && val) {
var arr = val.split(',').filter(Boolean);
var updated = false;
for (var i = 0; i < arr.length; i++) {
if (seenIds.indexOf(arr[i]) === -1) {
seenIds.push(arr[i]);
updated = true;
}
}
if (updated) {
try { localStorage.setItem('int_seen', JSON.stringify(seenIds)); } catch (e) {}
}
}
});
} catch (e) {}
}
</script>
