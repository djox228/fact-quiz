<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тамагочи 2.0</title>
  <script src="https://telegram.org"></script>
  <script src="https://adsgram.ai"></script>
  <style>
    :root {
      --bg: #0f111a;
      --card: #1a1d2d;
      --card-light: #25293e;
      --accent: #6c5ce7;
      --text: #ffffff;
      --sub: #8f9bb3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 14px 86px 14px;
      user-select: none;
    }
    .container { width: 100%; max-width: 420px; }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 12px 16px;
      border-radius: 18px;
      margin-bottom: 12px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .xp-bar-wrap { width: 130px; height: 6px; background: #0f111a; border-radius: 6px; margin-top: 5px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #a29bfe, #6c5ce7); width: 0%; transition: width 0.4s; }
    .level-badge {
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 13px;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.35);
    }

    /* Комната питомца */
    .room {
      height: 250px;
      background: radial-gradient(circle at 50% 40%, #2d3559 0%, #161926 100%);
      border-radius: 26px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 12px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.07);
      transition: background 0.6s ease;
    }
    .room.night {
      background: radial-gradient(circle at 50% 30%, #141829 0%, #090b12 100%);
    }
    .floor {
      position: absolute;
      bottom: -30px;
      width: 130%;
      height: 90px;
      background: rgba(255,255,255,0.03);
      border-radius: 50%;
    }
    .status-bubble {
      position: absolute;
      top: 12px;
      background: rgba(15, 17, 26, 0.65);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid rgba(255,255,255,0.08);
      z-index: 5;
    }
    .last-action {
      position: absolute;
      bottom: 10px;
      font-size: 11px;
      color: var(--sub);
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 12px;
      z-index: 5;
    }

    /* SVG Питомец */
    .pet-wrapper {
      position: relative;
      width: 165px;
      height: 165px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      animation: floatPet 3.2s ease-in-out infinite;
    }
    .pet-wrapper.jump { animation: jumpPet 0.5s ease; }
    .pet-shadow {
      width: 90px;
      height: 16px;
      background: rgba(0,0,0,0.45);
      border-radius: 50%;
      position: absolute;
      bottom: 34px;
      filter: blur(3px);
    }
    .particle {
      position: absolute;
      font-size: 20px;
      pointer-events: none;
      animation: flyUp 1s ease-out forwards;
      z-index: 10;
    }

    /* Статы (3 полоски в ряд) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: var(--card);
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    .stat-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .bar-bg { width: 100%; height: 7px; background: #0f111a; border-radius: 6px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }

    /* Кнопки действий */
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }
    .act-btn {
      background: var(--card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 12px 4px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .act-btn:active { transform: scale(0.93); background: var(--card-light); }
    .act-icon { font-size: 22px; }
    .act-label { font-size: 11px; font-weight: 600; color: #dfe6e9; }

    .btn-gold {
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 50%, #e17055 100%);
      color: #1e272e;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(253, 203, 110, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-gold:active { transform: scale(0.97); }

    /* Вкладки (Табы) */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Гардероб */
    .wardrobe-box {
      background: var(--card);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .wardrobe-title { font-size: 13px; color: var(--sub); margin-bottom: 10px; font-weight: 600; }
    .name-input-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .name-input {
      flex: 1;
      background: #0f111a;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 14px;
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .save-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .swatches { display: flex; gap: 10px; margin-bottom: 16px; }
    .swatch {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      border: 3px solid transparent;
    }
    .swatch.selected { border-color: #fff; transform: scale(1.1); }
    .acc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .acc-item {
      background: #0f111a;
      padding: 10px 4px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .acc-item.selected { border-color: var(--accent); background: var(--card-light); }

    /* Лидерборд */
    .leader-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 8px;
    }

    /* Нижняя навигация */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(26, 29, 45, 0.95);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 16px 0;
      border-top: 1px solid rgba(255,255,255,0.07);
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .nav-btn.active { color: #a29bfe; }
    .nav-btn span:first-child { font-size: 20px; }

    @keyframes floatPet {
      0%, 100% { transform: translateY(0) scaleY(1); }
      50% { transform: translateY(-6px) scaleY(1.03); }
    }
    @keyframes jumpPet {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-28px) scale(1.06, 0.94); }
      70% { transform: translateY(4px) scale(0.95, 1.05); }
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-65px) scale(1.3); }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Шапка -->
  <div class="header">
    <div>
      <div style="font-weight: 800; font-size: 17px;" id="petName">Пушистик</div>
      <div style="font-size: 11px; color: var(--sub);" id="xpText">Опыт: 0 / 100 XP</div>
      <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBar"></div></div>
    </div>
    <div class="level-badge" id="levelBadge">Ур. 1</div>
  </div>

  <!-- ВКЛАДКА 1: КОМНАТА -->
  <div id="tab-room" class="tab-content active">
    <div class="room" id="petRoom">
      <div class="status-bubble" id="moodText">😺 Привет! Погладь меня</div>

      <div class="pet-shadow"></div>

      <div class="pet-wrapper" id="petWrapper" onclick="petTouch(event)">
        <!-- Детализированный SVG-персонаж -->
        <svg width="150" height="150" viewBox="0 0 200 200" id="petSvg">
          <defs>
            <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ff9ff3" id="gradStart"/>
              <stop offset="100%" stop-color="#f368e0" id="gradEnd"/>
            </linearGradient>
          </defs>
          <!-- Ушки -->
          <path d="M52 75 C38 25, 72 20, 78 65 Z" fill="url(#bodyGrad)"/>

          <path d="M56 70 C47 38, 68 35, 72 64 Z" fill="#ffb8d9" opacity="0.7"/>

const API_URL = "workers.dev";
const tg = window.Telegram?.WebApp;
if (tg) {
tg.ready();
tg.expand();
}
const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "56776" }) : null;
const urlParams = new URLSearchParams(window.location.search);
const startParam = tg?.initDataUnsafe?.start_param;
const chatId = urlParams.get("chat_id") || (startParam ? startParam.replace("chat_", "") : null) || tg?.initDataUnsafe?.user?.id || "demo_chat";
const user = tg?.initDataUnsafe?.user || { id: "guest_1", first_name: "Игрок" };
const PALETTES = {
pink: ["#ff9ff3", "#f368e0"],
mint: ["#55efc4", "#00b894"],
sky: ["#74b9ff", "#0984e3"],
gold: ["#ffeaa7", "#fdcb6e"],
cyber: ["#a29bfe", "#6c5ce7"]
};
let currentPet = null;
function switchTab(tabName, btn) {
document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
document.querySelectorAll(".nav-btn").forEach(el => el.classList.remove("active"));
document.getElementById(tab-${tabName}).classList.add("active");
btn.classList.add("active");
if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}
function petTouch(e) {
const wrap = document.getElementById("petWrapper");
wrap.classList.remove("jump");
void wrap.offsetWidth;
wrap.classList.add("jump");
if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
// Вылетающие сердечки при клике
const room = document.getElementById("petRoom");
const heart = document.createElement("div");
heart.className = "particle";
heart.innerText = currentPet?.isSleeping ? "💤" : ["❤️", "✨", "💕", "🐾"][Math.floor(Math.random() * 4)];
heart.style.left = (e.offsetX || 80) + 110 + "px";
heart.style.top = (e.offsetY || 80) + 40 + "px";
room.appendChild(heart);
setTimeout(() => heart.remove(), 1000);
}
async function loadPet() {
try {
const res = await fetch(${API_URL}?chat_id=${chatId});
const data = await res.json();
if (data.pet) renderPet(data.pet);
} catch (e) {
document.getElementById("lastAction").innerText = "Автономный режим";
}
}
async function sendAction(action, extraPayload = {}) {
if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred("medium");
try {
const res = await fetch(${API_URL}?chat_id=${chatId}, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
action,
userId: user.id,
userName: user.first_name,
...extraPayload
})
});
const data = await res.json();
if (!data.ok && data.message) {
if (tg?.showAlert) tg.showAlert(data.message);
else alert(data.message);
}
if (data.pet) renderPet(data.pet);
} catch (e) {
console.error(e);
}
}
function saveName() {
const val = document.getElementById("nameInput").value.trim();
if (!val) return;
sendAction("customize", { name: val });
document.getElementById("nameInput").value = "";
switchTab("room", document.querySelector(".nav-btn"));
}
function setColor(colorKey) {
sendAction("customize", { color: colorKey });
}
function setAccessory(accKey) {
sendAction("customize", { accessory: accKey });
}
function watchAdForGold() {
if (!AdController) {
sendAction("golden_feed");
return;
}
AdController.show().then(() => {
sendAction("golden_feed");
if (tg?.showAlert) tg.showAlert("✨ Питомец съел Золотой корм! Все показатели 100%!");
}).catch(() => {
if (tg?.showAlert) tg.showAlert("Реклама временно недоступна.");
});
}
function renderPet(pet) {
currentPet = pet;
document.getElementById("petName").innerText = pet.name;
document.getElementById("levelBadge").innerText = Ур. ${pet.level};
const xpNeeded = pet.level * 100;
document.getElementById("xpText").innerText = Опыт: ${pet.xp} / ${xpNeeded} XP;
document.getElementById("xpBar").style.width = ${Math.min(100, (pet.xp / xpNeeded) * 100)}%;
document.getElementById("lastAction").innerText = pet.lastActionBy;
// Шкалы
document.getElementById("hungerVal").innerText = ${pet.hunger}%;
document.getElementById("hungerBar").style.width = ${pet.hunger}%;
document.getElementById("happyVal").innerText = ${pet.happiness}%;
document.getElementById("happyBar").style.width = ${pet.happiness}%;
const energy = pet.energy ?? 90;
document.getElementById("energyVal").innerText = ${energy}%;
document.getElementById("energyBar").style.width = ${energy}%;
// Цвет SVG
const colors = PALETTES[pet.color] || PALETTES.pink;
document.getElementById("gradStart").setAttribute("stop-color", colors[0]);
document.getElementById("gradEnd").setAttribute("stop-color", colors[1]);
// Аксессуары
["crown", "glasses", "bow"].forEach(id => {
document.getElementById(acc-${id}).style.display = (pet.accessory === id) ? "block" : "none";
});
// Сон и эмоции
const room = document.getElementById("petRoom");
const eyesOpen = document.getElementById("eyesOpen");
const eyesClosed = document.getElementById("eyesClosed");
const mouth = document.getElementById("mouthPath");
const mood = document.getElementById("moodText");
if (pet.isSleeping) {
room.classList.add("night");
eyesOpen.style.display = "none";
eyesClosed.style.display = "block";
document.getElementById("sleepIcon").innerText = "☀️";
document.getElementById("sleepLabel").innerText = "Разбудить";
mood.innerText = "💤 Питомец сладко спит...";
} else {
room.classList.remove("night");
eyesOpen.style.display = "block";
eyesClosed.style.display = "none";
document.getElementById("sleepIcon").innerText = "💤";
document.getElementById("sleepLabel").innerText = "Спать";
if (pet.hunger < 30) {
mouth.setAttribute("d", "M88 126 Q100 116 112 126");
mood.innerText = "😿 Очень голоден! Покорми меня";
} else if (energy < 25) {
mouth.setAttribute("d", "M92 123 Q100 123 108 123");
mood.innerText = "🥱 Хочу спать...";
} else {
mouth.setAttribute("d", "M88 120 Q100 132 112 120");
mood.innerText = "😺 Счастлив и готов играть!";
}
}
// Лидерборд
const list = document.getElementById("leaderboardList");
const entries = Object.values(pet.leaderboard || {}).sort((a, b) => b.score - a.score);
if (entries.length > 0) {
list.innerHTML = entries.map((item, idx) => <div class="leader-row"> <span>${idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : "🐾"} <b>${item.name}</b></span> <span style="color:#a29bfe; font-weight:700;">${item.score} XP</span> </div>).join("");
}
}
loadPet();
  </script>
</body>
</html>
