<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Правда или Фейк — Интуиция</title>
<script src="https://telegram.org"></script>
<script src="https://adsgram.ai"></script>
<style>
* { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #090b10; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff; display: flex; flex-direction: column; align-items: center;
}
.app {
    width: 100%; max-width: 430px; height: 100%; padding: 14px 16px 20px 16px;
    display: flex; flex-direction: column; justify-content: space-between;
}

.top-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.pill {
    background: #131722; border: 1px solid #242c3d; padding: 7px 11px; border-radius: 14px;
    font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 5px;
}
.streak-val { color: #f59e0b; font-size: 14px; }
.best-val { color: #38bdf8; }
.ai-badge { color: #34d399; border-color: rgba(52, 211, 153, 0.35); font-size: 11px; }

.card-arena {
    flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
    margin: 14px 0; perspective: 1000px;
}
.swipe-card {
    width: 100%; height: 100%; max-height: 440px;
    background: linear-gradient(155deg, #161b29 0%, #0e121b 100%);
    border: 1.5px solid #283248; border-radius: 26px; padding: 22px 18px;
    display: flex; flex-direction: column; justify-content: space-between;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
    position: relative; touch-action: none; cursor: grab;
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s;
}
.swipe-card.dragging { transition: none; cursor: grabbing; }

.card-header { display: flex; justify-content: space-between; align-items: center; }
.card-tag {
    background: rgba(56, 189, 248, 0.14); border: 1px solid rgba(56, 189, 248, 0.35);
    color: #7dd3fc; padding: 5px 12px; border-radius: 12px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.8px;
}
.ai-tag {
    background: rgba(52, 211, 153, 0.18); border: 1px solid rgba(52, 211, 153, 0.45);
    color: #6ee7b7; padding: 4px 9px; border-radius: 10px; font-size: 10px; font-weight: 900;
}

.card-statement {
    font-size: 17px; font-weight: 800; line-height: 1.42; color: #f8fafc; text-align: center; margin: auto 0;
    overflow-y: auto; max-height: 290px; padding: 4px;
}
.card-hint {
    display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase;
}

.stamp {
    position: absolute; top: 26px; padding: 6px 14px; border-radius: 10px;
    font-size: 20px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase;
    border: 3px solid; opacity: 0; pointer-events: none; z-index: 5;
}
.stamp-true { left: 20px; color: #22c55e; border-color: #22c55e; transform: rotate(-12deg); }
.stamp-fake { right: 20px; color: #ef4444; border-color: #ef4444; transform: rotate(12deg); }

.controls { display: flex; gap: 12px; }
.choice-btn {
    flex: 1; padding: 16px; border-radius: 18px; border: 2px solid;
    font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase;
    letter-spacing: 0.5px; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.choice-btn:active { transform: scale(0.95); }
.btn-fake { background: rgba(239, 68, 68, 0.12); border-color: #ef4444; color: #fca5a5; }
.btn-true { background: rgba(34, 197, 94, 0.12); border-color: #22c55e; color: #86efac; }

.modal {
    position: fixed; inset: 0; background: rgba(6, 8, 13, 0.88); backdrop-filter: blur(6px);
    display: none; flex-direction: column; justify-content: center; align-items: center;
    padding: 20px; z-index: 30;
}
.modal-box {
    width: 100%; max-width: 400px; background: #131722; border: 1.5px solid #283248;
    border-radius: 24px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;
    text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}
.verdict-badge {
    align-self: center; padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
}
.verdict-win { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
.verdict-lose { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
.fact-truth { font-size: 18px; font-weight: 900; color: #fff; }
.fact-story { font-size: 14px; line-height: 1.55; color: #cbd5e1; text-align: left; background: #0b0e15; padding: 14px; border-radius: 14px; border: 1px solid #1e2536; }

.action-btn {
    width: 100%; padding: 15px; border-radius: 15px; border: none;
    background: linear-gradient(90deg, #3b82f6, #2563eb); color: #fff;
    font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase;
}
.action-btn.save-streak { background: linear-gradient(90deg, #f59e0b, #ea580c); box-shadow: 0 6px 20px rgba(234, 88, 12, 0.4); }
</style>
</head>
<body>

<div class="app">
    <div class="top-bar">
        <div class="pill">🔥 Серия: <span class="streak-val" id="streak-txt">0</span></div>
        <div class="pill ai-badge" id="wiki-status">🌐 В колоде: 0</div>
        <div class="pill">🏆 Рекорд: <span class="best-val" id="best-txt">0</span></div>
    </div>

    <div class="card-arena">
        <div class="swipe-card" id="card">
            <div class="stamp stamp-true" id="stamp-true">ПРАВДА</div>
            <div class="stamp stamp-fake" id="stamp-fake">ФЕЙК</div>
            <div class="card-header">
                <div class="card-tag" id="card-cat">Энциклопедия</div>
                <div class="ai-tag" id="ai-tag">🌐 LIVE WIKI</div>
            </div>
            <div class="card-statement" id="card-text">Загружаем факты из сети...</div>
            <div class="card-hint">
                <span>← Свайп: Фейк</span>
                <span>Правда: Свайп →</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="choice-btn btn-fake" id="btn-fake">❌ Фейк</button>
        <button class="choice-btn btn-true" id="btn-true">✅ Правда</button>
    </div>
</div>

<div class="modal" id="result-modal">
    <div class="modal-box">
        <div class="verdict-badge" id="verdict-badge">Вердикт</div>
        <div class="fact-truth" id="fact-truth">Это чистая правда!</div>
        <div class="fact-story" id="fact-story">История...</div>
        <button class="action-btn save-streak" id="save-streak-btn" style="display:none;">❤️ Сохранить серию (за рекламу)</button>
        <button class="action-btn" id="next-btn">Следующая карточка →</button>
    </div>
</div>

<script>
var tg = window.Telegram ? window.Telegram.WebApp : null;
function openFullScreen() {
    if (!tg) return;
    try {
        tg.ready();
        tg.expand();
        if (tg.requestFullscreen) tg.requestFullscreen();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    } catch (e) {}
}
openFullScreen();
setTimeout(openFullScreen, 300);

var AdController = null;
function initAds() {
    try {
        if (window.Adsgram && !AdController) {
            AdController = window.Adsgram.init({ blockId: "56776" });
        }
    } catch (e) {}
}
initAds();
setTimeout(initAds, 1000);

var audioCtx = null;
function playBeep(freq, type, dur) {
    try {
        if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
}

var wikiFacts = [];
try {
    wikiFacts = JSON.parse(localStorage.getItem('tf_wiki_only_v1') || '[]');
} catch (e) { wikiFacts = []; }

var seenIds = [];
try {
    seenIds = JSON.parse(localStorage.getItem('tf_seen_only_v1') || '[]');
} catch (e) { seenIds = []; }

function persistSeenHistory() {
    var trimmed = seenIds.slice(-1000);
    try { localStorage.setItem('tf_seen_only_v1', JSON.stringify(trimmed)); } catch (e) {}
    if (tg && tg.CloudStorage) {
        try {
            var packed = trimmed.slice(-300).join(',');
            tg.CloudStorage.setItem('seen_only_v1', packed);
        } catch (e) {}
    }
}

function getFactHash(str) {
    var hash = 0;
    for (var i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash) + str.charCodeAt(i);
        hash |= 0;
    }
    return 'h' + Math.abs(hash).toString(36);
}

var deck = [];
var currentCard = null;
var streak = 0;
var bestStreak = parseInt(localStorage.getItem('tf_best_streak') || '0', 10);
var isAnimating = false;
var isFetchingWiki = false;

var streakTxt = document.getElementById('streak-txt');
var bestTxt = document.getElementById('best-txt');
var wikiStatus = document.getElementById('wiki-status');
bestTxt.innerText = bestStreak;

var cardEl = document.getElementById('card');
var cardCat = document.getElementById('card-cat');
var cardText = document.getElementById('card-text');
var stampTrue = document.getElementById('stamp-true');
var stampFake = document.getElementById('stamp-fake');
var resultModal = document.getElementById('result-modal');
var verdictBadge = document.getElementById('verdict-badge');
var factTruth = document.getElementById('fact-truth');
var factStory = document.getElementById('fact-story');
var saveStreakBtn = document.getElementById('save-streak-btn');
var nextBtn = document.getElementById('next-btn');
async function fetchWikipediaFacts() {
if (isFetchingWiki) return;
isFetchingWiki = true;
try {
var url = 'wikipedia.org∝=extracts&exintro=1&explaintext=1&exsentences=2&format=json&origin=*';
var res = await fetch(url);
var data = await res.json();
if (data && data.query && data.query.pages) {
var pages = Object.values(data.query.pages);
var added = 0;
for (var i = 0; i < pages.length; i++) {
var p = pages[i];
if (!p.extract || p.extract.length < 55) continue;
if (p.title && (p.title.indexOf('(значения)') !== -1 || p.title.indexOf('Список ') === 0)) continue;
var cleanText = p.extract.replace(/\([^)]*\)/g, '').replace(/\s+/g, ' ').trim();
if (cleanText.length < 50) continue;
if (cleanText.length > 320) {
var firstDot = cleanText.indexOf('. ', 60);
if (firstDot !== -1 && firstDot < 300) {
cleanText = cleanText.substring(0, firstDot + 1);
} else {
continue;
}
}
var cardId = 'w' + p.pageid;
if (seenIds.indexOf(cardId) !== -1) continue;
if (deck.some(function(d) { return d.id === cardId; })) continue;
var makeFake = false;
var displayText = cleanText;
var storyText = 'Чистая правда из энциклопедии о теме «' + p.title + '».';
var yearMatch = cleanText.match(/\b(1[4-9]\d\d|20[0-2]\d)\b/);
var numMatch = cleanText.match(/\b([2-9]\d|\d{3,})\b/);
if (yearMatch && yearMatch.length > 0 && Math.random() < 0.5) {
var realYearStr = yearMatch;
var realYear = parseInt(realYearStr, 10);
var shift = Math.random() < 0.5 ? 18 : -21;
var fakeYear = realYear + shift;
if (fakeYear > 2025) fakeYear = realYear - 24;
displayText = cleanText.replace(realYearStr, String(fakeYear));
makeFake = true;
storyText = 'Подвох в дате! На самом деле в статье Википедии о теме «' + p.title + '» указан ' + realYearStr + ' год, а не ' + fakeYear + '.';
} else if (numMatch && numMatch.length > 0 && Math.random() < 0.45) {
var realNumStr = numMatch;
var realNum = parseInt(realNumStr, 10);
var fakeNum = Math.round(realNum * (Math.random() < 0.5 ? 1.6 : 0.45));
if (fakeNum === realNum || fakeNum <= 0) fakeNum = realNum + 15;
displayText = cleanText.replace(realNumStr, String(fakeNum));
makeFake = true;
storyText = 'Подвох в цифрах! В реальности в статье о теме «' + p.title + '» указано число ' + realNumStr + ', а не ' + fakeNum + '.';
}
var cardObj = {
id: cardId,
cat: 'Энциклопедия',
text: displayText,
isTrue: !makeFake,
story: storyText
};
wikiFacts.push(cardObj);
deck.unshift(cardObj);
added++;
}
if (added > 0) {
if (wikiFacts.length > 500) wikiFacts = wikiFacts.slice(-500);
try { localStorage.setItem('tf_wiki_only_v1', JSON.stringify(wikiFacts)); } catch (e) {}
wikiStatus.innerHTML = '🌐 В колоде: ' + deck.length;
}
}
} catch (e) {}
isFetchingWiki = false;
}
function buildFreshDeck() {
var unseen = wikiFacts.filter(function(item) {
return seenIds.indexOf(item.id) === -1 && seenIds.indexOf(getFactHash(item.text)) === -1;
});
for (var i = unseen.length - 1; i > 0; i--) {
var j = Math.floor(Math.random() * (i + 1));
var temp = unseen[i];
unseen[i] = unseen[j];
unseen[j] = temp;
}
deck = unseen;
wikiStatus.innerHTML = '🌐 В колоде: ' + deck.length;
}
async function loadNextCard() {
if (deck.length === 0) buildFreshDeck();
if (deck.length < 15) fetchWikipediaFacts();
if (deck.length === 0) {
cardText.innerText = 'Загружаем свежие факты из сети...';
await fetchWikipediaFacts();
if (deck.length === 0) {
await fetchWikipediaFacts();
}
if (deck.length === 0) {
cardText.innerText = 'Не удалось загрузить факты. Проверьте интернет и нажмите любую кнопку ниже.';
isAnimating = false;
return;
}
}
currentCard = deck.pop();
if (currentCard) {
if (currentCard.id && seenIds.indexOf(currentCard.id) === -1) {
seenIds.push(currentCard.id);
}
var textHash = getFactHash(currentCard.text);
if (seenIds.indexOf(textHash) === -1) {
seenIds.push(textHash);
}
persistSeenHistory();
}
wikiStatus.innerHTML = '🌐 В колоде: ' + deck.length;
cardCat.innerText = currentCard.cat || 'Энциклопедия';
cardText.innerText = currentCard.text;
cardEl.style.transition = 'none';
cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
cardEl.style.opacity = '1';
stampTrue.style.opacity = '0';
stampFake.style.opacity = '0';
isAnimating = false;
}
function initGameWithCloud() {
if (tg && tg.CloudStorage) {
try {
tg.CloudStorage.getItem('seen_only_v1', function(err, cloudVal) {
if (!err && cloudVal) {
var cloudArr = cloudVal.split(',').filter(Boolean);
for (var i = 0; i < cloudArr.length; i++) {
if (seenIds.indexOf(cloudArr[i]) === -1) {
seenIds.push(cloudArr[i]);
}
}
try { localStorage.setItem('tf_seen_only_v1', JSON.stringify(seenIds)); } catch (e) {}
}
buildFreshDeck();
loadNextCard();
fetchWikipediaFacts();
});
return;
} catch (e) {}
}
buildFreshDeck();
loadNextCard();
fetchWikipediaFacts();
}
initGameWithCloud();
var lostStreakCache = 0;
function handleAnswer(userSaysTrue) {
if (isAnimating) return;
if (!currentCard) {
loadNextCard();
return;
}
isAnimating = true;
lostStreakCache = streak;
var dir = userSaysTrue ? 1 : -1;
cardEl.style.transition = 'transform 0.3s ease-out, opacity 0.3s';
cardEl.style.transform = 'translate(' + (dir * 450) + 'px, 40px) rotate(' + (dir * 22) + 'deg)';
cardEl.style.opacity = '0';
var isCorrect = (userSaysTrue === currentCard.isTrue);
if (tg && tg.HapticFeedback) {
try { tg.HapticFeedback.notificationOccurred(isCorrect ? 'success' : 'error'); } catch (e) {}
}
setTimeout(function() {
factTruth.innerText = currentCard.isTrue ? 'На самом деле: ЭТО ПРАВДА!' : 'На самом деле: ЭТО ФЕЙК!';
factStory.innerText = currentCard.story;
if (isCorrect) {
streak++;
if (streak > bestStreak) {
bestStreak = streak;
localStorage.setItem('tf_best_streak', bestStreak);
bestTxt.innerText = bestStreak;
}
streakTxt.innerText = streak;
verdictBadge.className = 'verdict-badge verdict-win';
verdictBadge.innerText = 'В точку! +1 к серии';
saveStreakBtn.style.display = 'none';
nextBtn.innerText = 'Дальше \u2192';
playBeep(660, 'sine', 0.15);
} else {
verdictBadge.className = 'verdict-badge verdict-lose';
verdictBadge.innerText = 'Ошибочка! Интуиция подвела';
if (streak >= 2) {
saveStreakBtn.style.display = 'block';
saveStreakBtn.innerText = '❤️ Спасти серию (' + streak + ') за рекламу';
} else {
saveStreakBtn.style.display = 'none';
}
streak = 0;
streakTxt.innerText = streak;
nextBtn.innerText = 'Следующий факт \u2192';
playBeep(180, 'sawtooth', 0.25);
}
resultModal.style.display = 'flex';
}, 240);
}
var startX = 0, currentX = 0, dragging = false;
function onDragStart(x) {
if (isAnimating || !currentCard) return;
dragging = true;
startX = x;
currentX = 0;
cardEl.classList.add('dragging');
}
function onDragMove(x) {
if (!dragging) return;
currentX = x - startX;
var rot = currentX * 0.06;
cardEl.style.transform = 'translate(' + currentX + 'px, 0px) rotate(' + rot + 'deg)';
if (currentX > 25) {
stampTrue.style.opacity = Math.min(1, (currentX - 25) / 80);
stampFake.style.opacity = '0';
} else if (currentX < -25) {
stampFake.style.opacity = Math.min(1, (-currentX - 25) / 80);
stampTrue.style.opacity = '0';
} else {
stampTrue.style.opacity = '0';
stampFake.style.opacity = '0';
}
}
function onDragEnd() {
if (!dragging) return;
dragging = false;
cardEl.classList.remove('dragging');
if (currentX > 95) {
handleAnswer(true);
} else if (currentX < -95) {
handleAnswer(false);
} else {
cardEl.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
cardEl.style.transform = 'translate(0px, 0px) rotate(0deg)';
stampTrue.style.opacity = '0';
stampFake.style.opacity = '0';
}
}
cardEl.addEventListener('touchstart', function(e) { if (e.touches && e.touches.length > 0) onDragStart(e.touches.clientX); }, { passive: true });
cardEl.addEventListener('touchmove', function(e) { if (e.touches && e.touches.length > 0) onDragMove(e.touches.clientX); }, { passive: true });
cardEl.addEventListener('touchend', onDragEnd);
cardEl.addEventListener('mousedown', function(e) { onDragStart(e.clientX); });
window.addEventListener('mousemove', function(e) { onDragMove(e.clientX); });
window.addEventListener('mouseup', onDragEnd);
document.getElementById('btn-fake').addEventListener('click', function() { handleAnswer(false); });
document.getElementById('btn-true').addEventListener('click', function() { handleAnswer(true); });
nextBtn.addEventListener('click', function() {
resultModal.style.display = 'none';
loadNextCard();
});
saveStreakBtn.addEventListener('click', function() {
saveStreakBtn.disabled = true;
saveStreakBtn.innerText = 'Подключение рекламы...';
function launchAd() {
initAds();
if (!AdController) {
saveStreakBtn.disabled = false;
saveStreakBtn.innerText = 'Реклама пока недоступна (повторить)';
return;
}
saveStreakBtn.innerText = 'Загрузка ролика...';
AdController.show().then(function() {
streak = lostStreakCache;
streakTxt.innerText = streak;
saveStreakBtn.disabled = false;
saveStreakBtn.style.display = 'none';
resultModal.style.display = 'none';
loadNextCard();
}).catch(function() {
saveStreakBtn.disabled = false;
saveStreakBtn.innerText = 'Нет доступных роликов (повторить)';
});
}
if (!window.Adsgram) {
var s = document.createElement('script');
s.src = 'adsgram.ai';
s.onload = launchAd;
s.onerror = function() {
saveStreakBtn.disabled = false;
saveStreakBtn.innerText = 'Ошибка сети / блокировщик рекламы';
};
document.head.appendChild(s);
} else {
launchAd();
}
});
    </script>
</body>
</html>
