<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rift Keepers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#05050a;color:#fff;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* HUD Сверху */
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.glass{background:rgba(20,25,45,0.6);backdrop-filter:blur(15px);border:1px solid rgba(0,255,255,0.2);border-radius:16px;padding:10px 16px;box-shadow:0 5px 15px rgba(0,0,0,0.5)}
.val{font-size:18px;font-weight:900;color:#0ff;text-shadow:0 0 10px #0ff}
.lbl{font-size:10px;color:#8f9bb3;text-transform:uppercase;font-weight:800;letter-spacing:1px}

/* Панель снизу */
.bottom-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg, #05050a 70%, transparent 100%);padding:20px 15px 30px;z-index:10;display:flex;flex-direction:column;gap:15px}

/* Табы */
.tabs{display:flex;gap:5px;background:rgba(20,25,45,0.8);padding:5px;border-radius:16px;border:1px solid rgba(255,255,255,0.05)}
.tab-btn{flex:1;background:transparent;border:none;padding:12px 5px;border-radius:12px;color:#8f9bb3;font-weight:900;font-size:12px;transition:all 0.3s}
.tab-btn.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 0 15px rgba(108,92,231,0.5)}

/* Контент */
.content{display:none;animation:fadeIn 0.3s}
.content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Кнопки */
.btn{width:100%;border:none;padding:16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;transition:transform 0.1s;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn-open{background:linear-gradient(135deg,#00b894,#00cec9);color:#fff;box-shadow:0 5px 20px rgba(0,206,201,0.4);margin-bottom:10px}
.btn-buy{background:linear-gradient(135deg,#fdcb6e,#e17055);color:#1e272e;box-shadow:0 5px 20px rgba(253,203,110,0.4)}
.btn-fight{background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;box-shadow:0 5px 20px rgba(255,71,87,0.5)}

/* Инвентарь */
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:160px;overflow-y:auto;padding:5px}
.inv-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:10px 5px;text-align:center;font-size:10px;font-weight:bold;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:5px}
.inv-item.equipped{border-color:#0ff;background:rgba(0,255,255,0.15);box-shadow:0 0 15px rgba(0,255,255,0.3)}

/* АРЕНА (Полоска HP босса) */
.boss-hp-bar{width:100%;height:24px;background:#1a1a2e;border-radius:12px;overflow:hidden;border:2px solid #ff4757;box-shadow:0 0 15px rgba(255,71,87,0.5);position:relative;margin-bottom:10px}
.boss-fill{height:100%;background:linear-gradient(90deg,#ff4757,#ff9f43);width:100%;transition:width 0.3s}
.boss-text{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:12px;font-weight:900;text-shadow:1px 1px 2px #000}

/* CS:GO Рулетка */
#case-modal{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(5,5,10,0.95);backdrop-filter:blur(10px);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.roulette-container{width:100%;height:120px;background:#111;border-top:2px solid #333;border-bottom:2px solid #333;position:relative;display:flex;align-items:center;overflow:hidden}
.roulette-strip{display:flex;gap:10px;position:absolute;left:0;transition:transform 3s cubic-bezier(0.1, 0.7, 0.1, 1)}
.roulette-item{width:80px;height:80px;background:#222;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:30px;flex-shrink:0;border:2px solid #444}
.roulette-item.win{border-color:#0ff;box-shadow:0 0 20px #0ff;background:rgba(0,255,255,0.2)}
.center-line{position:absolute;left:50%;top:0;bottom:0;width:4px;background:#0ff;box-shadow:0 0 15px #0ff;transform:translateX(-50%);z-index:10}
</style>
</head>
<body>

<div class="hud">
  <div class="glass">
    <div class="lbl">Монеты</div>
    <div class="val" id="ui-coins" style="color:#fdcb6e;text-shadow:0 0 10px #fdcb6e">0</div>
  </div>
  <div class="glass" style="text-align:right;border-color:rgba(108,92,231,0.5)">
    <div class="lbl">Кейсы</div>
    <div class="val" id="ui-cases" style="color:#a29bfe;text-shadow:0 0 10px #a29bfe">0</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pet', this)">👾 Питомец</button>
    <button class="tab-btn" onclick="switchTab('cases', this)">📦 Кейсы</button>
    <button class="tab-btn" onclick="switchTab('arena', this)">⚔️ Арена</button>
  </div>

  <div id="content-pet" class="content active">
    <div style="font-size:12px;text-align:center;color:#0ff;margin-bottom:5px;font-weight:bold" id="ui-log">Загрузка...</div>
    <div style="font-size:12px;text-align:center;color:#fff;margin-bottom:10px;font-weight:bold">Сила: <span id="ui-power" style="color:#ff4757">0</span></div>
    <div class="inv-grid" id="inv-grid"></div>
  </div>

  <div id="content-cases" class="content">
    <button class="btn btn-open" onclick="openCase()">🔓 Открыть Кейс</button>
    <button class="btn btn-buy" onclick="buyCase()">🛒 Купить Кейс (200 🪙)</button>
  </div>

  <div id="content-arena" class="content">
    <div class="boss-hp-bar">
      <div class="boss-fill" id="boss-fill"></div>
      <div class="boss-text" id="boss-text">HP: 1000 / 1000</div>
    </div>
    <div style="text-align:center;margin-bottom:10px;font-size:12px;color:#ff9f43" id="ui-boss-level">БОСС УР. 1</div>
    <button class="btn btn-fight" onclick="fightBoss()">⚔️ АТАКОВАТЬ</button>
  </div>
</div>

<!-- Модалка Рулетки -->
<div id="case-modal">
  <div class="roulette-container">
    <div class="center-line"></div>
    <div class="roulette-strip" id="roulette-strip"></div>
  </div>
  <div style="margin-top:30px;font-size:24px;font-weight:900;color:#0ff;opacity:0;transition:opacity 0.5s" id="drop-text">Выпало!</div>
</div>

<script>
var API = "https://tamagotchi-bot.djogrinder22.workers.dev/api/game"; // Твой URL
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var me = { id: "u_" + Math.floor(Math.random() * 90000 + 10000) };
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) me.id = String(tg.initDataUnsafe.user.id);
var qp = new URLSearchParams(location.search);
var chatId = qp.get("chat_id") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param ? tg.initDataUnsafe.start_param.replace("chat_", "") : null) || me.id;

var state = { coins: 0, cases: 0, inventory: [], equipped: {}, bossLevel: 1, bossMaxHp: 1000, bossHp: 1000 };

// ================= THREE.JS =================
var scene, camera, renderer, petGroup, bossGroup, coreMesh, rings = [];
var equippedMeshes = {};

function init3D() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05050a, 0.04);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 1.5, 7);
  camera.lookAt(0, 0.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  var dLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dLight.position.set(5, 10, 5);
  scene.add(dLight);
  var cyanLight = new THREE.PointLight(0x00ffff, 3, 10);
  cyanLight.position.set(-3, 2, 3);
  scene.add(cyanLight);

  // Платформа
  var platGeo = new THREE.CylinderGeometry(2.5, 2.8, 0.1, 64);
  var platMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 });
  var platform = new THREE.Mesh(platGeo, platMat);
  platform.position.y = -1.5;
  scene.add(platform);

  // ================= ПИТОМЕЦ =================
  petGroup = new THREE.Group();

  var coreGeo = new THREE.IcosahedronGeometry(0.5, 1);
  var coreMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1 });
  coreMesh = new THREE.Mesh(coreGeo, coreMat);
  petGroup.add(coreMesh);

  var bodyGeo = new THREE.SphereGeometry(1.0, 64, 64);
  var bodyMat = new THREE.MeshPhysicalMaterial({ color: 0x74b9ff, transparent: true, opacity: 0.3, roughness: 0.1, clearcoat: 1, transmission: 0.9 });
  var body = new THREE.Mesh(bodyGeo, bodyMat);
  petGroup.add(body);

  var eyeGeo = new THREE.SphereGeometry(0.12, 32, 32);
  var eyeMat = new THREE.MeshStandardMaterial({ color: 0x05050a });
  var eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.25, 0.15, 0.9); petGroup.add(eyeL);
  var eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.25, 0.15, 0.9); petGroup.add(eyeR);
  
  var shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var s1 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), shineMat); s1.position.set(-0.28, 0.18, 0.98); petGroup.add(s1);
  var s2 = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), shineMat); s2.position.set(0.22, 0.18, 0.98); petGroup.add(s2);

  for(var i=0; i<2; i++) {
    var ringGeo = new THREE.TorusGeometry(1.3 + i*0.2, 0.02, 16, 64);
    var ringMat = new THREE.MeshBasicMaterial({ color: i === 0 ? 0x00ffff : 0xff00ff, transparent: true, opacity: 0.5 });
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.rotation.y = i * 0.5;
    petGroup.add(ring);
    rings.push(ring);
  }

  petGroup.position.set(0, 0, 2); // Ставим питомца вперед
  scene.add(petGroup);

  // ================= БОСС (Скрыт по умолчанию) =================
  bossGroup = new THREE.Group();
  var bossCoreGeo = new THREE.IcosahedronGeometry(1.5, 0);
  var bossCoreMat = new THREE.MeshStandardMaterial({ color: 0xff4757, emissive: 0xff4757, emissiveIntensity: 0.8, roughness: 0.2, metalness: 0.8 });
  var bossCore = new THREE.Mesh(bossCoreGeo, bossCoreMat);
  bossGroup.add(bossCore);

  var spikeGeo = new THREE.ConeGeometry(0.3, 1.5, 4);
  var spikeMat = new THREE.MeshStandardMaterial({ color: 0x6c5ce7, emissive: 0x6c5ce7, emissiveIntensity: 0.5 });
  for(var i=0; i<6; i++){
    var spike = new THREE.Mesh(spikeGeo, spikeMat);
    var angle = (i / 6) * Math.PI * 2;
    spike.position.set(Math.cos(angle) * 1.8, Math.sin(angle) * 1.8, 0);
    spike.rotation.z = angle - Math.PI/2;
    bossGroup.add(spike);
  }
  bossGroup.position.set(0, 1, -3); // Босс сзади
  bossGroup.visible = false; // Показываем только на арене
  scene.add(bossGroup);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  var t = Date.now() * 0.001;

  if (petGroup) {
    petGroup.position.y = Math.sin(t * 2) * 0.15;
    rings.forEach(function(ring, i) {
      ring.rotation.z = t * (i === 0 ? 1 : -1);
    });
    if (coreMesh) coreMesh.scale.setScalar(1 + Math.sin(t * 5) * 0.1);
  }

  if (bossGroup && bossGroup.visible) {
    bossGroup.rotation.y += 0.01;
    bossGroup.position.y = 1 + Math.sin(t * 1.5) * 0.1;
  }

  renderer.render(scene, camera);
}

// ================= ЛОГИКА 3D ЭКИПИРОВКИ =================
function update3DPet() {
  for(var key in equippedMeshes) petGroup.remove(equippedMeshes[key]);
  equippedMeshes = {};

  // Шляпа
  if (state.equipped["hat"]) {
    var hatGroup = new THREE.Group();
    var hatId = state.equipped["hat"];
    if (hatId === "hat_top") {
      var b = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.05, 32), new THREE.MeshStandardMaterial({color:0x111}));
      var t = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.5, 32), new THREE.MeshStandardMaterial({color:0x111}));
      t.position.y = 0.25; hatGroup.add(b, t);
    } else if (hatId === "hat_crown") {
      var crown = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.2, 8), new THREE.MeshStandardMaterial({color:0xffd32a, metalness:0.9}));
      hatGroup.add(crown);
    } else {
      var cap = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 16, 0, Math.PI * 2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color:0x333}));
      hatGroup.add(cap);
    }
    hatGroup.position.set(0, 1.0, 0);
    petGroup.add(hatGroup);
    equippedMeshes["hat"] = hatGroup;
  }

  // Очки
  if (state.equipped["glasses"]) {
    var glassGroup = new THREE.Group();
    var glassId = state.equipped["glasses"];
    if (glassId === "glass_cyber") {
      var gMat = new THREE.MeshStandardMaterial({color:0x00ffff, emissive:0x00ffff, transparent:true, opacity:0.6});
      var visor = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.15, 0.1), gMat);
      visor.position.set(0, 0.15, 0.92); glassGroup.add(visor);
    } else {
      var gMat2 = new THREE.MeshStandardMaterial({color:0x111, metalness: 0.8});
      var lensL = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.1), gMat2); lensL.position.set(-0.25, 0.15, 0.92);
      var lensR = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.12, 0.1), gMat2); lensR.position.set(0.25, 0.15, 0.92);
      glassGroup.add(lensL, lensR);
    }
    petGroup.add(glassGroup);
    equippedMeshes["glasses"] = glassGroup;
  }

  // КРЫЛЬЯ (Теперь объемные и 3D!)
  if (state.equipped["wings"]) {
    var wingGroup = new THREE.Group();
    var wingId = state.equipped["wings"];
    
    var wMat = new THREE.MeshStandardMaterial({
      color: wingId === "wing_angel" ? 0xffffff : 0x220000, 
      emissive: wingId === "wing_angel" ? 0xffffff : 0xff4757,
      emissiveIntensity: 0.5,
      side: THREE.DoubleSide,
      roughness: 0.3
    });
    
    // Создаем форму крыла через кривую
    var shape = new THREE.Shape();
    shape.moveTo(0, 0);
    shape.quadraticCurveTo(0.5, 0.5, 1.0, -0.2);
    shape.quadraticCurveTo(0.8, -0.6, 0, -0.8);
    shape.lineTo(0, 0);
    
    var extrudeSettings = { depth: 0.05, bevelEnabled: false };
    var wingGeo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
    
    var wL = new THREE.Mesh(wingGeo, wMat);
    wL.position.set(-0.8, 0, -0.3);
    wL.rotation.y = 0.8; // Разворачиваем назад
    wL.rotation.z = -0.2;
    
    var wR = new THREE.Mesh(wingGeo, wMat);
    wR.position.set(0.8, 0, -0.3);
    wR.rotation.y = -0.8;
    wR.rotation.z = 0.2;
    
    wingGroup.add(wL, wR);
    petGroup.add(wingGroup);
    equippedMeshes["wings"] = wingGroup;
  }
}

// ================= UI & API =================
function updateUI() {
  document.getElementById("ui-coins").innerText = state.coins;
  document.getElementById("ui-cases").innerText = state.cases;
  document.getElementById("ui-log").innerText = state.lastAction;

  // Полоска босса
  var hpPercent = Math.max(0, (state.bossHp / state.bossMaxHp) * 100);
  document.getElementById("boss-fill").style.width = hpPercent + "%";
  document.getElementById("boss-text").innerText = "HP: " + Math.max(0, state.bossHp) + " / " + state.bossMaxHp;
  document.getElementById("ui-boss-level").innerText = "БОСС УР. " + state.bossLevel;

  // Подсчет силы
  var itemsPower = {
    "hat_cap": 5, "hat_top": 15, "hat_crown": 40,
    "glass_sun": 5, "glass_cyber": 20,
    "wing_bat": 30, "wing_angel": 80
  };
  var totalPower = 10; // Базовая сила
  for(var k in state.equipped) {
    totalPower += itemsPower[state.equipped[k]] || 0;
  }
  document.getElementById("ui-power").innerText = totalPower;

  // Инвентарь
  var grid = document.getElementById("inv-grid");
  grid.innerHTML = "";
  var itemNames = {
    "hat_cap": "Кепка", "hat_top": "Цилиндр", "hat_crown": "Корона",
    "glass_sun": "Очки", "glass_cyber": "Визор",
    "wing_bat": "Демон", "wing_angel": "Ангел"
  };
  var itemIcons = {
    "hat_cap": "🧢", "hat_top": "🎩", "hat_crown": "👑",
    "glass_sun": "🕶️", "glass_cyber": "🥽",
    "wing_bat": "🦇", "wing_angel": "🦋"
  };

  var uniqueInv = [];
  state.inventory.forEach(function(item) {
    if (uniqueInv.indexOf(item) === -1) uniqueInv.push(item);
  });

  uniqueInv.forEach(function(itemId) {
    var div = document.createElement("div");
    div.className = "inv-item";
    var isEq = false;
    for(var k in state.equipped) { if (state.equipped[k] === itemId) isEq = true; }
    if (isEq) div.classList.add("equipped");
    div.innerHTML = "<div style='font-size:20px'>" + (itemIcons[itemId] || "❓") + "</div>" + (itemNames[itemId] || itemId);
    div.onclick = function() { equipItem(itemId); };
    grid.appendChild(div);
  });

  if (typeof update3DPet === "function") update3DPet();
}

function switchTab(tab, btn) {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  document.querySelectorAll(".content").forEach(function(c){ c.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("content-" + tab).classList.add("active");
  
  // Управление видимостью 3D-босса
  if (tab === "arena") {
    bossGroup.visible = true;
    petGroup.position.set(0, -0.5, 3); // Отодвигаем питомца
    camera.position.set(0, 2, 9); // Камера дальше
  } else {
    bossGroup.visible = false;
    petGroup.position.set(0, 0, 2); // Возвращаем питомца
    camera.position.set(0, 1.5, 7);
  }
  camera.lookAt(0, 0.5, 0);
}

function apiCall(action, extra) {
  var bodyData = { action: action, userId: me.id };
  if (extra) for (var k in extra) bodyData[k] = extra[k];

  fetch(API + "?chat_id=" + chatId, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(bodyData)
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d.ok && d.message && tg) tg.showAlert(d.message);
    if(d.state) { state = d.state; updateUI(); }
  })
  .catch(function(e){ if(tg) tg.showAlert("Ошибка сети"); });
}

// ================= CS:GO РУЛЕТКА =================
function openCase() {
  if (state.cases <= 0) return tg.showAlert("Нет кейсов! Купи в магазине.");
  
  var modal = document.getElementById("case-modal");
  var strip = document.getElementById("roulette-strip");
  var txt = document.getElementById("drop-text");
  
  modal.style.display = "flex";
  txt.style.opacity = 0;
  strip.style.transition = "none";
  strip.style.transform = "translateX(0)";
  strip.innerHTML = "";

  // Генерируем 50 случайных предметов для рулетки
  var icons = ["🧢", "🎩", "👑", "🕶️", "🥽", "🦇", "🦋"];
  for (var i = 0; i < 50; i++) {
    var div = document.createElement("div");
    div.className = "roulette-item";
    div.innerText = icons[Math.floor(Math.random() * icons.length)];
    strip.appendChild(div);
  }

  // Запрос на сервер
  apiCall("open_case", {}); 

  setTimeout(function() {
    var winIcon = "🎁";
    var dropId = state.lastDrop;
    if (dropId === "hat_cap") winIcon = "🧢";
    else if (dropId === "hat_top") winIcon = "🎩";
    else if (dropId === "hat_crown") winIcon = "👑";
    else if (dropId === "glass_sun") winIcon = "🕶️";
    else if (dropId === "glass_cyber") winIcon = "🥽";
    else if (dropId === "wing_bat") winIcon = "🦇";
    else if (dropId === "wing_angel") winIcon = "🦋";

    // Ставим выигрышный предмет в центр рулетки (25-й элемент)
    var winItem = strip.children[25];
    winItem.innerText = winIcon;
    winItem.classList.add("win");

    // Прокрутка
    strip.style.transition = "transform 3s cubic-bezier(0.1, 0.7, 0.1, 1)";
    // Смещение так, чтобы 25-й элемент встал под центр
    var offset = (25 * 90) - (window.innerWidth / 2) + 40;
    strip.style.transform = "translateX(-" + offset + "px)";

    setTimeout(function() {
      txt.innerText = "Выпало: " + winIcon;
      txt.style.opacity = 1;
      setTimeout(function() { modal.style.display = "none"; }, 2000);
    }, 3100); // Ждем окончания анимации
  }, 100);
}

function buyCase() { apiCall("buy_case", {}); }
function equipItem(id) { apiCall("equip", { itemId: id }); }
function fightBoss() { 
  apiCall("battle", {});
  // Анимация атаки
  if (petGroup) {
    var originalZ = petGroup.position.z;
    petGroup.position.z += 2;
    setTimeout(function(){ petGroup.position.z = originalZ; }, 200);
  }
}

// Запуск
init3D();
apiCall("init");

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
