<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Aura • Твой личный статус</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#050508;color:#fff;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* HUD */
.hud{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.glass{background:rgba(20,25,45,0.5);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:12px 20px;box-shadow:0 5px 15px rgba(0,0,0,0.5); text-align:center;}
.val{font-size:24px;font-weight:900;color:#00ffff;text-shadow:0 0 15px #00ffff}
.lbl{font-size:10px;color:#8f9bb3;text-transform:uppercase;font-weight:800;letter-spacing:1px;margin-top:4px}

/* Нижняя панель задач */
.bottom-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg, #050508 70%, transparent 100%);padding:20px 15px 30px;z-index:10;display:flex;flex-direction:column;gap:10px}
.task-list{background:rgba(20,25,45,0.8);border:1px solid rgba(0,255,255,0.2);border-radius:20px;padding:15px;display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.05);padding:12px 15px;border-radius:12px;font-size:14px;font-weight:bold;transition:all 0.3s}
.task-item.done{opacity:0.4;background:rgba(0,255,255,0.1);text-decoration:line-through;color:#00ffff}
.check-btn{background:#00ffff;border:none;width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;color:#000;font-weight:900;font-size:16px;box-shadow:0 0 10px #00ffff;transition:transform 0.1s}
.check-btn:active{transform:scale(0.8)}

/* Эффекты вспышки при выполнении */
.flash{position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(circle, rgba(0,255,255,0.4) 0%, transparent 70%);pointer-events:none;opacity:0;z-index:2;transition:opacity 0.2s}
</style>
</head>
<body>

<div class="flash" id="flash"></div>

<div class="hud">
  <div class="glass">
    <div class="val" id="ui-aura">0</div>
    <div class="lbl">Уровень Ауры</div>
  </div>
  <div class="glass" style="border-color:rgba(255,215,0,0.3)">
    <div class="val" id="ui-streak" style="color:#ffd32a;text-shadow:0 0 15px #ffd32a">0 🔥</div>
    <div class="lbl">Дней подряд</div>
  </div>
</div>

<div class="bottom-panel">
  <div style="font-size:12px;color:#8f9bb3;text-align:center;font-weight:bold;margin-bottom:5px">ТВОИ ЕЖЕДНЕВНЫЕ ЦЕЛИ</div>
  <div class="task-list" id="task-list">
    <!-- Задачи генерируются через JS -->
  </div>
</div>

<script>
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var haptic = function(t) { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(t || 'light'); };

// Локальное сохранение состояния
var auraData = JSON.parse(localStorage.getItem("aura_save") || '{"aura": 0, "streak": 0, "tasks": {}, "lastDate": ""}');

var today = new Date().toDateString();
if (auraData.lastDate !== today) {
  // Новый день - сбрасываем задачи, но проверяем стрик
  auraData.tasks = {};
  auraData.lastDate = today;
  // Если вчера не заходил - сбрасываем стрик (упрощенно для прототипа)
  saveData();
}

function saveData() {
  localStorage.setItem("aura_save", JSON.stringify(auraData));
}

// Список доступных задач
var DAILY_TASKS = [
  { id: "water", text: "💧 Выпить стакан воды" },
  { id: "stretch", text: "🤸 Сделать растяжку" },
  { id: "read", text: "📖 Прочитать 10 страниц" },
  { id: "nosugar", text: "🍏 Не есть сладкое" },
  { id: "walk", text: "🚶 Пройти 5000 шагов" }
];

// ================= THREE.JS =================
var scene, camera, renderer;
var crystalGroup, crystalMesh, particles = [];
var clock = new THREE.Clock();
var currentColor = new THREE.Color(0x00ffff);

function init3D() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x050508, 0.03);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2, 7);
  camera.lookAt(0, 0.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputEncoding = THREE.sRGBEncoding;
  
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.2));
  
  var dLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dLight.position.set(3, 5, 4);
  scene.add(dLight);

  // Направленный свет изнутри для эффекта свечения
  var pointLight = new THREE.PointLight(0x00ffff, 2, 10);
  pointLight.position.set(0, 1, 0);
  scene.add(pointLight);

  // ПЛАТФОРМА
  var platform = new THREE.Mesh(new THREE.CylinderGeometry(2, 2.2, 0.2, 64), new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 }));
  platform.position.y = -0.1;
  scene.add(platform);

  // КОЛЬЦА ВОКРУГ
  for(var i=0; i<2; i++) {
    var ring = new THREE.Mesh(new THREE.TorusGeometry(1.5 + i*0.3, 0.02, 16, 64), new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.4 }));
    ring.rotation.x = Math.PI / 2;
    ring.position.y = 0.5 + i*0.3;
    scene.add(ring);
  }

  // КРИСТАЛЛ (Многослойный)
  crystalGroup = new THREE.Group();
  
  // Внутреннее ядро
  var coreGeo = new THREE.OctahedronGeometry(0.6, 0);
  var coreMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1, wireframe: true });
  var coreMesh = new THREE.Mesh(coreGeo, coreMat);
  crystalGroup.add(coreMesh);

  // Внешняя оболочка (стекло)
  var shellGeo = new THREE.IcosahedronGeometry(0.8, 0);
  var shellMat = new THREE.MeshPhysicalMaterial({ 
    color: 0x00ffff, 
    metalness: 0.1, 
    roughness: 0.1, 
    transparent: true, 
    opacity: 0.4,
    clearcoat: 1,
    clearcoatRoughness: 0.1
  });
  crystalMesh = new THREE.Mesh(shellGeo, shellMat);
  crystalGroup.add(crystalMesh);

  crystalGroup.position.y = 1.2;
  scene.add(crystalGroup);

  // ЧАСТИЦЫ (Звездная пыль)
  var particleGeo = new THREE.BufferGeometry();
  var particleCount = 100;
  var posArray = new Float32Array(particleCount * 3);
  
  for(var i=0; i<particleCount; i++) {
    var angle = Math.random() * Math.PI * 2;
    var radius = 1.5 + Math.random() * 3;
    var height = -1 + Math.random() * 4;
    
    posArray[i*3] = Math.cos(angle) * radius;
    posArray[i*3+1] = height;
    posArray[i*3+2] = Math.sin(angle) * radius;
  }
  
  particleGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
  var particleMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 0.05, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
  var particleSystem = new THREE.Points(particleGeo, particleMat);
  scene.add(particleSystem);
  particles.push(particleSystem); // Сохраняем для анимации

  updateCrystalColor();
  animate();
}

function updateCrystalColor() {
  // Цвет зависит от Ауры
  var aura = auraData.aura;
  if (aura < 10) currentColor.setHex(0x00ffff); // Циан (новичок)
  else if (aura < 30) currentColor.setHex(0x9b59b6); // Фиолетовый
  else if (aura < 60) currentColor.setHex(0xff00ff); // Маджента
  else currentColor.setHex(0xffd700); // Золотой

  if(crystalMesh) {
    crystalMesh.material.color.copy(currentColor);
    crystalMesh.material.emissive = currentColor;
  }
}

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  var dt = Math.min(clock.getDelta(), 0.1);

  // Левитация и вращение кристалла
  if (crystalGroup) {
    crystalGroup.position.y = 1.2 + Math.sin(t * 1.5) * 0.1;
    crystalGroup.rotation.y += 0.005;
    crystalGroup.rotation.x = Math.sin(t * 0.5) * 0.1;
    
    // Пульсация при высоком уровне ауры
    var scale = 1 + Math.sin(t * 3) * (0.02 + (auraData.aura * 0.001));
    crystalGroup.scale.set(scale, scale, scale);
  }

  // Вращение колец
  scene.children.forEach(function(child) {
    if (child.geometry && child.geometry.type === 'TorusGeometry') {
      child.rotation.z = t * 0.5;
    }
  });

  // Мерцание частиц
  particles.forEach(function(p) {
    p.rotation.y = t * 0.05;
    p.material.opacity = 0.4 + Math.sin(t * 2) * 0.2;
  });

  renderer.render(scene, camera);
}

// ================= UI & ЛОГИКА =================
function renderTasks() {
  var list = document.getElementById("task-list");
  list.innerHTML = "";
  
  DAILY_TASKS.forEach(function(task) {
    var isDone = !!auraData.tasks[task.id];
    var div = document.createElement("div");
    div.className = "task-item" + (isDone ? " done" : "");
    
    div.innerHTML = `
      <span>${task.text}</span>
      ${isDone ? '<span style="color:#00ffff">Выполнено</span>' : `<button class="check-btn" onclick="completeTask('${task.id}')">✓</button>`}
    `;
    list.appendChild(div);
  });
}

function updateUI() {
  document.getElementById("ui-aura").innerText = auraData.aura;
  document.getElementById("ui-streak").innerText = auraData.streak + " 🔥";
  renderTasks();
  updateCrystalColor();
}

window.completeTask = function(taskId) {
  if (auraData.tasks[taskId]) return; // Уже выполнено
  
  auraData.tasks[taskId] = true;
  auraData.aura += 10;
  
  // Проверка на идеальный день (все задачи)
  var allDone = DAILY_TASKS.every(function(t) { return auraData.tasks[t.id]; });
  if (allDone) {
    auraData.aura += 20; // Бонус
    auraData.streak += 1;
  }
  
  saveData();
  updateUI();
  haptic('success');
  
  // Визуальный эффект вспышки
  var flash = document.getElementById("flash");
  flash.style.opacity = 1;
  setTimeout(function() { flash.style.opacity = 0; }, 300);
  
  // Эффект на кристалле (временное резкое увеличение)
  if(crystalGroup) {
    crystalGroup.scale.set(1.5, 1.5, 1.5);
    setTimeout(function(){ crystalGroup.scale.set(1,1,1); }, 300);
  }
};

// Запуск
init3D();
updateUI();

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
