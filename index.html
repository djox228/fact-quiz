<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Nook</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#0a0a14;color:#fff;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* HUD Сверху */
.hud{position:absolute;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.glass{background:rgba(20,25,45,0.7);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:10px 20px;box-shadow:0 5px 15px rgba(0,0,0,0.5)}
.val{font-size:22px;font-weight:900;color:#ffeaa7;text-shadow:0 0 10px #ffeaa7}

/* Экран выбора */
#selection-screen{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(10,10,20,0.95);backdrop-filter:blur(10px);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#selection-screen h2{font-size:26px;margin-bottom:10px;color:#fff}
#selection-screen p{color:#8f9bb3;margin-bottom:30px;font-size:14px}
.pet-options{display:flex;gap:15px}
.pet-card{background:#151828;border:2px solid rgba(255,255,255,0.05);border-radius:24px;padding:20px;width:100px;cursor:pointer;transition:all 0.2s}
.pet-card:active{transform:scale(0.95)}
.pet-card:hover{border-color:#6c5ce7}
.pet-card .icon{font-size:40px;margin-bottom:10px}

/* Кнопка взаимодействия */
.actions{position:absolute;bottom:40px;width:100%;display:flex;justify-content:center;z-index:10}
.btn-pet{background:linear-gradient(135deg,#ff9ff3,#f368e0);border:none;padding:18px 40px;border-radius:30px;font-size:18px;font-weight:900;color:#fff;box-shadow:0 10px 25px rgba(243,104,224,0.4);transition:transform 0.1s}
.btn-pet:active{transform:scale(0.95)}
</style>
</head>
<body>

<div class="hud">
  <div class="glass">
    <div class="val" id="ui-coins">0 🪙</div>
  </div>
</div>

<div class="actions">
  <button class="btn-pet" onclick="petAction()">✨ Погладить</button>
</div>

<!-- Экран выбора -->
<div id="selection-screen" style="display:none;">
  <h2>Кто будет жить здесь?</h2>
  <p>Выбери своего уникального компаньона</p>
  <div class="pet-options">
    <div class="pet-card" onclick="selectPet('cat')">
      <div class="icon">🐱</div>
      <b>Кот</b>
    </div>
    <div class="pet-card" onclick="selectPet('fox')">
      <div class="icon">🦊</div>
      <b>Лис</b>
    </div>
    <div class="pet-card" onclick="selectPet('robot')">
      <div class="icon">🤖</div>
      <b>Робот</b>
    </div>
  </div>
</div>

<div id="log-text" style="position:absolute;bottom:100px;width:100%;text-align:center;color:#8f9bb3;font-size:13px;z-index:10;pointer-events:none" id="ui-log"></div>

<script>
var API = "https://tamagotchi-bot.djogrinder22.workers.dev/api/game"; // Твой URL
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var me = { id: "u_" + Math.floor(Math.random() * 90000 + 10000) };
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) me.id = String(tg.initDataUnsafe.user.id);
var qp = new URLSearchParams(location.search);
var chatId = qp.get("chat_id") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param ? tg.initDataUnsafe.start_param.replace("chat_", "") : null) || me.id;

var state = { coins: 0, petType: null, lastAction: "" };

// ================= THREE.JS =================
var scene, camera, renderer;
var petGroup;
var clock = new THREE.Clock();

function init3D() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a14, 0.03);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.5, 6);
  camera.lookAt(0, 0.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  var dLight = new THREE.DirectionalLight(0xffffff, 1.2);
  dLight.position.set(5, 10, 5);
  scene.add(dLight);
  
  var pLight = new THREE.PointLight(0x00ffff, 2, 10);
  pLight.position.set(-3, 2, 3);
  scene.add(pLight);

  // КОМНАТА (Уютный уголок)
  // Пол
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.8 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.5;
  scene.add(floor);

  // Ковер
  var rug = new THREE.Mesh(new THREE.CircleGeometry(2.5, 64), new THREE.MeshStandardMaterial({ color: 0x2d2350 }));
  rug.rotation.x = -Math.PI / 2;
  rug.position.y = -0.49;
  scene.add(rug);

  // Стена
  var wall = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 }));
  wall.position.set(0, 4.5, -2.5);
  scene.add(wall);

  // Окно
  var windowFrame = new THREE.Mesh(new THREE.BoxGeometry(3, 2, 0.1), new THREE.MeshStandardMaterial({ color: 0x2a2f4a }));
  windowFrame.position.set(0, 1.5, -2.4);
  scene.add(windowFrame);
  
  var windowGlass = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 1.8), new THREE.MeshBasicMaterial({ color: 0x0f1428 }));
  windowGlass.position.set(0, 1.5, -2.35);
  scene.add(windowGlass);

  // Платформа для питомца
  var platform = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.3, 0.1, 32), new THREE.MeshStandardMaterial({ color: 0x252b48 }));
  platform.position.set(0, -0.45, 0.5);
  scene.add(platform);

  // Группа питомца (создается позже)
  petGroup = new THREE.Group();
  scene.add(petGroup);

  animate();
}

// ================= ГЕНЕРАЦИЯ УНИКАЛЬНЫХ ПИТОМЦЕВ =================
function createPet(type) {
  // Очищаем старую группу
  while(petGroup.children.length > 0){ 
    petGroup.remove(petGroup.children[0]); 
  }

  var bodyMat, eyeMat, accentMat;
  var body, head, earL, earR, tail;

  if (type === "cat") {
    bodyMat = new THREE.MeshStandardMaterial({ color: 0xff9ff3, roughness: 0.4 });
    accentMat = new THREE.MeshStandardMaterial({ color: 0xc44569 });
    
    body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), bodyMat);
    body.position.y = 0.5;
    petGroup.add(body);

    // Уши
    var earGeo = new THREE.ConeGeometry(0.2, 0.4, 4);
    earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.4, 1.1, 0); earL.rotation.z = 0.2;
    earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.4, 1.1, 0); earR.rotation.z = -0.2;
    petGroup.add(earL, earR);

    // Хвост
    tail = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16), accentMat);
    tail.position.set(0, 0.4, -0.8); tail.rotation.x = -0.5;
    petGroup.add(tail);

  } else if (type === "fox") {
    bodyMat = new THREE.MeshStandardMaterial({ color: 0xe17055, roughness: 0.4 });
    accentMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    
    body = new THREE.Mesh(new THREE.SphereGeometry(0.7, 32, 32), bodyMat);
    body.position.y = 0.5;
    petGroup.add(body);

    // Уши (вытянутые)
    var earGeo = new THREE.ConeGeometry(0.15, 0.6, 4);
    earL = new THREE.Mesh(earGeo, bodyMat); earL.position.set(-0.35, 1.2, 0); earL.rotation.z = 0.1;
    earR = new THREE.Mesh(earGeo, bodyMat); earR.position.set(0.35, 1.2, 0); earR.rotation.z = -0.1;
    petGroup.add(earL, earR);

    // Мордочка
    var snout = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.4, 16), accentMat);
    snout.position.set(0, 0.4, 0.65); snout.rotation.x = Math.PI/2;
    petGroup.add(snout);

    // Пушистый хвост
    tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.0, 16), bodyMat);
    tail.position.set(0, 0.3, -0.9); tail.rotation.x = -0.8;
    petGroup.add(tail);

  } else if (type === "robot") {
    bodyMat = new THREE.MeshStandardMaterial({ color: 0x74b9ff, metalness: 0.8, roughness: 0.2 });
    accentMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 0.8 });
    
    // Тело
    body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), bodyMat);
    body.position.y = 0.5;
    petGroup.add(body);

    // Голова
    var head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.7), bodyMat);
    head.position.y = 1.2;
    petGroup.add(head);

    // Антенна
    var antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8), accentMat);
    antenna.position.set(0, 1.6, 0);
    petGroup.add(antenna);
    var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), accentMat);
    bulb.position.set(0, 1.8, 0);
    petGroup.add(bulb);

    // Руки (парящие)
    var armGeo = new THREE.SphereGeometry(0.15, 16, 16);
    var armL = new THREE.Mesh(armGeo, bodyMat); armL.position.set(-0.65, 0.6, 0);
    var armR = new THREE.Mesh(armGeo, bodyMat); armR.position.set(0.65, 0.6, 0);
    petGroup.add(armL, armR);
  }

  // Глаза (общие для всех)
  eyeMat = new THREE.MeshStandardMaterial({ color: 0x05050a });
  var eyeGeo = new THREE.SphereGeometry(0.08, 16, 16);
  var eyeL = new THREE.Mesh(eyeGeo, eyeMat);
  var eyeR = new THREE.Mesh(eyeGeo, eyeMat);
  
  if (type === "robot") {
    eyeL.position.set(-0.15, 1.25, 0.36);
    eyeR.position.set(0.15, 1.25, 0.36);
  } else {
    eyeL.position.set(-0.2, 0.6, 0.6);
    eyeR.position.set(0.2, 0.6, 0.6);
  }
  petGroup.add(eyeL, eyeR);

  petGroup.position.set(0, 0, 0.5);
}

// ================= АНИМАЦИЯ =================
function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  if (petGroup) {
    // Плавное дыхание
    var scale = 1 + Math.sin(t * 2) * 0.03;
    petGroup.scale.set(scale, scale, scale);
    // Легкое покачивание
    petGroup.position.y = Math.sin(t * 1.5) * 0.05;
  }

  renderer.render(scene, camera);
}

// ================= UI & API =================
function updateUI() {
  document.getElementById("ui-coins").innerText = state.coins + " 🪙";
  document.getElementById("ui-log").innerText = state.lastAction;

  if (!state.petType) {
    document.getElementById("selection-screen").style.display = "flex";
  } else {
    document.getElementById("selection-screen").style.display = "none";
    if (petGroup.children.length === 0) {
      createPet(state.petType);
    }
  }
}

window.selectPet = function(type) {
  document.getElementById("selection-screen").style.display = "none";
  createPet(type); // Мгновенно создаем 3D модель
  apiCall("select_pet", { petType: type });
};

window.petAction = function() {
  if (!state.petType) return;
  // Визуальный эффект (сердечко)
  var heart = document.createElement("div");
  heart.innerText = "❤️";
  heart.style.position = "absolute";
  heart.style.left = "50%";
  heart.style.top = "50%";
  heart.style.fontSize = "30px";
  heart.style.transform = "translate(-50%, -50%)";
  heart.style.animation = "floatUp 1s forwards";
  heart.style.zIndex = "100";
  document.body.appendChild(heart);
  setTimeout(function(){ heart.remove(); }, 1000);

  apiCall("pet", {});
};

function apiCall(action, extra) {
  var bodyData = { action: action, userId: me.id };
  if (extra) for (var k in extra) bodyData[k] = extra[k];

  fetch(API + "?chat_id=" + chatId, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(bodyData)
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.state) { 
      state = d.state; 
      updateUI(); 
    }
  });
}

// Добавляем CSS для анимации сердечка
var style = document.createElement('style');
style.innerHTML = `@keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); } }`;
document.head.appendChild(style);

// Запуск
init3D();
apiCall("init");

window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
