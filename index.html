<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Neon Rift</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#050510;color:#fff;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
canvas{width:100%;height:100%;display:block;touch-action:none}

/* UI Верхняя панель */
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;pointer-events:none;z-index:10}
.glass{background:rgba(15,20,40,.7);backdrop-filter:blur(10px);border:1px solid rgba(0,255,255,.3);border-radius:16px;padding:8px 16px;box-shadow:0 0 15px rgba(0,255,255,.1)}
.val{font-size:18px;font-weight:900;color:#0ff;text-shadow:0 0 10px #0ff}
.lbl{font-size:10px;color:#8f9bb3;text-transform:uppercase;font-weight:800;letter-spacing:1px}

/* Нижняя панель действий */
.actions{position:absolute;bottom:20px;left:15px;right:15px;z-index:10;display:flex;flex-direction:column;gap:10px}
.btn{width:100%;border:none;padding:16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;transition:all .1s;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn-summon{background:linear-gradient(135deg,#00cec9,#0984e3);color:#fff;box-shadow:0 0 20px rgba(0,206,201,0.4)}
.btn-battle{background:linear-gradient(135deg,#ff4757,#ff6b81);color:#fff;box-shadow:0 0 20px rgba(255,71,87,0.4)}

/* Уведомление */
#toast{position:absolute;top:15%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:bold;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:20;text-align:center;border:1px solid rgba(255,255,255,0.2);width:80%}
</style>
</head>
<body>

<div class="hud">
  <div class="glass">
    <div class="lbl">Энергия</div>
    <div class="val" id="ui-energy">50 / 50</div>
  </div>
  <div class="glass" style="text-align:right">
    <div class="lbl">Монеты</div>
    <div class="val" id="ui-coins" style="color:#ffeaa7;text-shadow:0 0 10px #ffeaa7">0</div>
  </div>
</div>

<div id="toast">Текст</div>

<div class="actions">
  <div style="display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px;color:#8f9bb3;font-weight:bold;">
    <span>Ур. Арены: <span id="ui-arena" style="color:#fff">1</span></span>
    <span id="ui-log">Собери отряд</span>
  </div>
  <button class="btn btn-summon" id="btn-summon">🌀 Призыв (10 ⚡)</button>
  <button class="btn btn-battle" id="btn-battle">⚔️ В БОЙ (Авто-Баттлер)</button>
</div>

<script>
var API = "https://tamagotchi-bot.djogrinder22.workers.dev/api/game"; // Твой URL воркера
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var me = { id: "u_" + Math.floor(Math.random() * 90000 + 10000) };
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
  me.id = String(tg.initDataUnsafe.user.id);
}
var qp = new URLSearchParams(location.search);
var chatId = qp.get("chat_id") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param ? tg.initDataUnsafe.start_param.replace("chat_", "") : null) || me.id;

var state = { energy: 0, coins: 0, arenaLevel: 1, grid: Array(9).fill(null) };
var haptic = function(t) { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(t || 'light'); };

// ================= THREE.JS =================
var scene, camera, renderer;
var unitsGroup = new THREE.Group();
var gridBoxes = [];
var draggingUnit = null;
var isDragging = false;
var dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
var raycaster = new THREE.Raycaster();
var mouse = new THREE.Vector2();

function init3D() {
  scene = new THREE.Scene();
  // Туман для неоновой глубины
  scene.fog = new THREE.FogExp2(0x050510, 0.05);
  
  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 7, 6);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  var dLight = new THREE.DirectionalLight(0x00ffff, 1.5);
  dLight.position.set(5, 10, 5);
  scene.add(dLight);
  var pLight = new THREE.PointLight(0xff00ff, 2, 20);
  pLight.position.set(-5, 5, -5);
  scene.add(pLight);

  // Сетка 3x3
  var spacing = 2.2;
  for (var i = 0; i < 9; i++) {
    var row = Math.floor(i / 3);
    var col = i % 3;
    var x = (col - 1) * spacing;
    var z = (row - 1) * spacing;

    // Ячейка (подложка)
    var boxGeo = new THREE.BoxGeometry(2, 0.1, 2);
    var boxMat = new THREE.MeshStandardMaterial({ color: 0x111122, transparent: true, opacity: 0.8 });
    var box = new THREE.Mesh(boxGeo, boxMat);
    box.position.set(x, -0.05, z);
    box.userData = { index: i };
    scene.add(box);
    gridBoxes.push(box);

    // Рамка ячейки (неон)
    var edges = new THREE.EdgesGeometry(boxGeo);
    var line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.3 }));
    line.position.copy(box.position);
    scene.add(line);
  }

  scene.add(unitsGroup);

  // Обработка событий
  renderer.domElement.addEventListener("pointerdown", onPointerDown);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  var t = Date.now() * 0.002;
  
  // Пульсация юнитов
  unitsGroup.children.forEach(function(mesh, idx) {
    if (!isDragging || mesh !== draggingUnit) {
      mesh.position.y = 0.5 + Math.sin(t + idx) * 0.1;
    }
    if (mesh.userData.level) {
      mesh.scale.setScalar(1 + (mesh.userData.level * 0.05));
    }
  });

  renderer.render(scene, camera);
}

// ================= ЛОГИКА ИГРЫ =================
function getUnitColor(level) {
  if (level === 1) return 0x00ffff; // Циан
  if (level === 2) return 0xff00ff; // Маджента
  if (level === 3) return 0xffff00; // Желтый
  return 0xff4757; // Красный (4+)
}

function renderGrid() {
  // Очищаем старых юнитов
  while(unitsGroup.children.length > 0){ 
    unitsGroup.remove(unitsGroup.children[0]); 
  }

  var spacing = 2.2;
  for (var i = 0; i < 9; i++) {
    var unit = state.grid[i];
    if (unit) {
      var row = Math.floor(i / 3);
      var col = i % 3;
      var x = (col - 1) * spacing;
      var z = (row - 1) * spacing;

      var geo = new THREE.SphereGeometry(0.6, 32, 32);
      var mat = new THREE.MeshStandardMaterial({ 
        color: getUnitColor(unit.level), 
        emissive: getUnitColor(unit.level), 
        emissiveIntensity: 0.5,
        roughness: 0.2,
        metalness: 0.8
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.5, z);
      mesh.userData = { index: i, level: unit.level, id: unit.id };
      unitsGroup.add(mesh);
    }
  }
}

function onPointerDown(event) {
  if (event.target.tagName !== 'CANVAS') return; // Игнорируем клики по кнопкам
  
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  var intersects = raycaster.intersectObjects(unitsGroup.children);

  if (intersects.length > 0) {
    draggingUnit = intersects[0].object;
    isDragging = true;
    haptic('light');
    // Поднимаем юнита
    draggingUnit.position.y = 2;
  }
}

function onPointerMove(event) {
  if (!isDragging || !draggingUnit) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  var intersectPoint = new THREE.Vector3();
  raycaster.ray.intersectPlane(dragPlane, intersectPoint);

  if (intersectPoint) {
    draggingUnit.position.x = intersectPoint.x;
    draggingUnit.position.z = intersectPoint.z;
  }
}

function onPointerUp(event) {
  if (!isDragging || !draggingUnit) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  var intersects = raycaster.intersectObjects(gridBoxes);

  if (intersects.length > 0) {
    var targetBox = intersects[0].object;
    var fromIndex = draggingUnit.userData.index;
    var toIndex = targetBox.userData.index;

    if (fromIndex !== toIndex) {
      // Проверяем, есть ли кто-то в целевой ячейке
      var targetUnit = state.grid[toIndex];
      var sourceUnit = state.grid[fromIndex];

      if (targetUnit && sourceUnit && targetUnit.level === sourceUnit.level) {
        // СЛИЯНИЕ
        apiCall("merge", { from: fromIndex, to: toIndex });
        haptic('success');
      } else {
        // Возвращаем на место (если не сливаем)
        renderGrid(); 
      }
    } else {
      renderGrid();
    }
  } else {
    renderGrid(); // Сброс, если бросили мимо
  }

  isDragging = false;
  draggingUnit = null;
}

// ================= API =================
function apiCall(action, extra) {
  var bodyData = { action: action, userId: me.id };
  if (extra) for (var k in extra) bodyData[k] = extra[k];

  fetch(API + "?chat_id=" + chatId, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(bodyData)
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (!d.ok && d.message) showToast(d.message);
    if (d.state) {
      state = d.state;
      updateUI();
      renderGrid();
    }
  })
  .catch(function(e) { showToast("Ошибка сети"); });
}

function updateUI() {
  document.getElementById("ui-energy").innerText = state.energy + " / " + state.maxEnergy;
  document.getElementById("ui-coins").innerText = state.coins;
  document.getElementById("ui-arena").innerText = state.arenaLevel;
  if (state.lastAction) document.getElementById("ui-log").innerText = state.lastAction;
}

function showToast(msg) {
  var t = document.getElementById("toast");
  t.innerText = msg;
  t.style.opacity = 1;
  setTimeout(function() { t.style.opacity = 0; }, 2500);
}

// Кнопки
document.getElementById("btn-summon").onclick = function() { apiCall("summon"); };
document.getElementById("btn-battle").onclick = function() { apiCall("battle"); };

// Запуск
init3D();
apiCall("init"); // Первичная загрузка

setInterval(function() {
  // Тихий опрос каждые 10 секунд для обновления энергии
  fetch(API + "?chat_id=" + chatId)
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d.state){ state = d.state; updateUI(); } });
}, 10000);

</script>
</body>
</html>
