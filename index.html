<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rift Keepers</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#05050a;color:#fff;user-select:none;overflow:hidden;height:100vh;display:flex;flex-direction:column}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}

/* HUD Сверху */
.hud{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:10;pointer-events:none}
.glass{background:rgba(20,25,45,0.6);backdrop-filter:blur(15px);border:1px solid rgba(0,255,255,0.2);border-radius:16px;padding:10px 16px;box-shadow:0 5px 15px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,255,255,0.1)}
.val{font-size:18px;font-weight:900;color:#0ff;text-shadow:0 0 10px #0ff}
.lbl{font-size:10px;color:#8f9bb3;text-transform:uppercase;font-weight:800;letter-spacing:1px}

/* Панель снизу */
.bottom-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg, #05050a 60%, transparent 100%);padding:20px 15px 30px;z-index:10;display:flex;flex-direction:column;gap:15px}

/* Табы */
.tabs{display:flex;gap:10px;background:rgba(20,25,45,0.8);padding:5px;border-radius:16px;border:1px solid rgba(255,255,255,0.05)}
.tab-btn{flex:1;background:transparent;border:none;padding:12px;border-radius:12px;color:#8f9bb3;font-weight:900;font-size:14px;transition:all 0.3s;cursor:pointer}
.tab-btn.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 0 15px rgba(108,92,231,0.5)}

/* Контент вкладок */
.content{display:none;animation:fadeIn 0.3s}
.content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* Кнопки */
.btn{width:100%;border:none;padding:16px;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;transition:transform 0.1s;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:active{transform:scale(.96)}
.btn-open{background:linear-gradient(135deg,#00b894,#00cec9);color:#fff;box-shadow:0 5px 20px rgba(0,206,201,0.4);margin-bottom:10px}
.btn-buy{background:linear-gradient(135deg,#fdcb6e,#e17055);color:#1e272e;box-shadow:0 5px 20px rgba(253,203,110,0.4)}

/* Инвентарь */
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-height:180px;overflow-y:auto;padding:5px;margin-top:10px}
.inv-item{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:14px;padding:12px 5px;text-align:center;font-size:11px;font-weight:bold;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:5px}
.inv-item:active{transform:scale(0.95)}
.inv-item.equipped{border-color:#0ff;background:rgba(0,255,255,0.15);box-shadow:0 0 15px rgba(0,255,255,0.3)}

/* Модалка кейса */
#case-modal{position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(5,5,10,0.95);backdrop-filter:blur(10px);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center}
.case-box{width:120px;height:120px;background:rgba(20,25,45,1);border:4px solid #0ff;border-radius:24px;display:flex;justify-content:center;align-items:center;font-size:50px;box-shadow:0 0 30px rgba(0,255,255,0.5);animation:shake 0.3s infinite}
@keyframes shake{0%{transform:rotate(0) scale(1)}25%{transform:rotate(10deg) scale(1.05)}50%{transform:rotate(0) scale(1)}75%{transform:rotate(-10deg) scale(1.05)}100%{transform:rotate(0) scale(1)}}
.drop-text{font-size:24px;font-weight:900;margin-top:30px;opacity:0;transition:opacity 0.5s;color:#0ff;text-shadow:0 0 20px #0ff}
</style>
</head>
<body>

<div class="hud">
  <div class="glass">
    <div class="lbl">Монеты</div>
    <div class="val" id="ui-coins" style="color:#fdcb6e;text-shadow:0 0 10px #fdcb6e">0</div>
  </div>
  <div class="glass" style="text-align:right;border-color:rgba(108,92,231,0.5)">
    <div class="lbl">Кейсы</div>
    <div class="val" id="ui-cases" style="color:#a29bfe;text-shadow:0 0 10px #a29bfe">0</div>
  </div>
</div>

<div class="bottom-panel">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('pet', this)">👾 Питомец</button>
    <button class="tab-btn" onclick="switchTab('cases', this)">📦 Кейсы</button>
  </div>

  <div id="content-pet" class="content active">
    <div style="font-size:13px;text-align:center;color:#0ff;margin-bottom:5px;font-weight:bold" id="ui-log">Загрузка...</div>
    <div class="inv-grid" id="inv-grid"></div>
  </div>

  <div id="content-cases" class="content">
    <button class="btn btn-open" onclick="openCase()">🔓 Открыть Кейс (100 🪙)</button>
    <button class="btn btn-buy" onclick="buyCase()">🛒 Купить Кейс (100 🪙)</button>
  </div>
</div>

<div id="case-modal">
  <div class="case-box" id="case-box">📦</div>
  <div class="drop-text" id="drop-text">...</div>
</div>

<script>
var API = "https://tamagotchi-bot.djogrinder22.workers.dev/api/game"; // Твой URL
var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

var me = { id: "u_" + Math.floor(Math.random() * 90000 + 10000) };
if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) me.id = String(tg.initDataUnsafe.user.id);
var qp = new URLSearchParams(location.search);
var chatId = qp.get("chat_id") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param ? tg.initDataUnsafe.start_param.replace("chat_", "") : null) || me.id;

var state = { coins: 0, cases: 0, inventory: [], equipped: {} };

// ================= THREE.JS =================
var scene, camera, renderer, petGroup, coreMesh, rings = [];
var equippedMeshes = {};

function init3D() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05050a, 0.04); // Туман для глубины

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 2.5, 7); // Камера по центру и чуть выше
  camera.lookAt(0, 0.5, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  document.body.appendChild(renderer.domElement);

  // Свет
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  
  var dLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dLight.position.set(5, 10, 5);
  scene.add(dLight);
  
  var cyanLight = new THREE.PointLight(0x00ffff, 3, 10);
  cyanLight.position.set(-3, 2, 3);
  scene.add(cyanLight);

  var pinkLight = new THREE.PointLight(0xff00ff, 3, 10);
  pinkLight.position.set(3, 0, 2);
  scene.add(pinkLight);

  // ================= СОЗДАНИЕ ПИТОМЦА =================
  petGroup = new THREE.Group();

  // 1. Ядро (светится внутри)
  var coreGeo = new THREE.IcosahedronGeometry(0.6, 1);
  var coreMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1 });
  coreMesh = new THREE.Mesh(coreGeo, coreMat);
  petGroup.add(coreMesh);

  // 2. Тело (полупрозрачный пузырь)
  var bodyGeo = new THREE.SphereGeometry(1.2, 64, 64);
  var bodyMat = new THREE.MeshPhysicalMaterial({ 
    color: 0x74b9ff, 
    transparent: true, 
    opacity: 0.3, 
    roughness: 0.1, 
    clearcoat: 1, 
    transmission: 0.9 // Эффект стекла
  });
  var body = new THREE.Mesh(bodyGeo, bodyMat);
  petGroup.add(body);

  // 3. Глаза
  var eyeGeo = new THREE.SphereGeometry(0.15, 32, 32);
  var eyeMat = new THREE.MeshStandardMaterial({ color: 0x05050a });
  var eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-0.3, 0.2, 1.05); petGroup.add(eyeL);
  var eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set(0.3, 0.2, 1.05); petGroup.add(eyeR);
  
  // Блики в глазах
  var shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  var s1 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), shineMat); s1.position.set(-0.35, 0.25, 1.15); petGroup.add(s1);
  var s2 = new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 16), shineMat); s2.position.set(0.25, 0.25, 1.15); petGroup.add(s2);

  // 4. Парящие кольца вокруг
  for(var i=0; i<2; i++) {
    var ringGeo = new THREE.TorusGeometry(1.5 + i*0.2, 0.02, 16, 64);
    var ringMat = new THREE.MeshBasicMaterial({ color: i === 0 ? 0x00ffff : 0xff00ff, transparent: true, opacity: 0.5 });
    var ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2;
    ring.rotation.y = i * 0.5;
    petGroup.add(ring);
    rings.push(ring);
  }

  // 5. Платформа под питомцем
  var platGeo = new THREE.CylinderGeometry(1.8, 2.0, 0.1, 64);
  var platMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.2 });
  var platform = new THREE.Mesh(platGeo, platMat);
  platform.position.y = -1.5;
  scene.add(platform);

  // Добавляем группу питомца на сцену
  petGroup.position.y = 0.5;
  scene.add(petGroup);

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  var t = Date.now() * 0.001;

  if (petGroup) {
    // Плавное парение
    petGroup.position.y = 0.5 + Math.sin(t * 2) * 0.15;
    
    // Вращение колец
    rings.forEach(function(ring, i) {
      ring.rotation.z = t * (i === 0 ? 1 : -1);
      ring.rotation.x = Math.PI / 2 + Math.sin(t + i) * 0.2;
    });

    // Пульсация ядра
    if (coreMesh) {
      coreMesh.scale.setScalar(1 + Math.sin(t * 5) * 0.1);
    }
  }

  renderer.render(scene, camera);
}

// ================= ЛОГИКА ЭКИПИРОВКИ =================
function update3DPet() {
  // 1. Очищаем старые меши экипировки
  for(var key in equippedMeshes) {
    petGroup.remove(equippedMeshes[key]);
  }
  equippedMeshes = {};

  // 2. Шляпа
  if (state.equipped["hat"]) {
    var hatGroup = new THREE.Group();
    var hatId = state.equipped["hat"];
    
    if (hatId === "hat_top") {
      var b = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.05, 32), new THREE.MeshStandardMaterial({color:0x111}));
      var t = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.7, 32), new THREE.MeshStandardMaterial({color:0x111}));
      t.position.y = 0.35;
      hatGroup.add(b, t);
    } else if (hatId === "hat_crown") {
      var crown = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.25, 8), new THREE.MeshStandardMaterial({color:0xffd32a, metalness:0.9, roughness:0.1}));
      hatGroup.add(crown);
    } else if (hatId === "hat_cap") {
      var capBase = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 16, 0, Math.PI * 2, 0, Math.PI/2), new THREE.MeshStandardMaterial({color:0x333}));
      var visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.05, 0.4), new THREE.MeshStandardMaterial({color:0x333}));
      visor.position.set(0, 0.05, 0.5);
      hatGroup.add(capBase, visor);
    }
    
    hatGroup.position.set(0, 1.1, 0); // На макушку
    petGroup.add(hatGroup);
    equippedMeshes["hat"] = hatGroup;
  }

  // 3. Очки / Визор
  if (state.equipped["glasses"]) {
    var glassGroup = new THREE.Group();
    var glassId = state.equipped["glasses"];
    
    if (glassId === "glass_cyber") {
      var gMat = new THREE.MeshStandardMaterial({color:0x00ffff, emissive:0x00ffff, transparent:true, opacity:0.6});
      var visor = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.2, 0.1), gMat);
      visor.position.set(0, 0.2, 1.05);
      glassGroup.add(visor);
    } else {
      var gMat2 = new THREE.MeshStandardMaterial({color:0x111, metalness: 0.8});
      var lensL = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), gMat2);
      lensL.position.set(-0.3, 0.2, 1.1);
      var lensR = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.1), gMat2);
      lensR.position.set(0.3, 0.2, 1.1);
      glassGroup.add(lensL, lensR);
    }
    
    petGroup.add(glassGroup);
    equippedMeshes["glasses"] = glassGroup;
  }

  // 4. Крылья
  if (state.equipped["wings"]) {
    var wingGroup = new THREE.Group();
    var wingId = state.equipped["wings"];
    
    var wMat = new THREE.MeshStandardMaterial({
      color: wingId === "wing_angel" ? 0xffffff : 0xff4757, 
      side: THREE.DoubleSide, 
      transparent: true, 
      opacity: 0.8,
      emissive: wingId === "wing_angel" ? 0xffffff : 0xff4757,
      emissiveIntensity: 0.3
    });
    
    var wL = new THREE.Mesh(new THREE.CircleGeometry(0.7, 32), wMat);
    wL.position.set(-0.9, 0, -0.5); wL.rotation.y = 0.6;
    var wR = new THREE.Mesh(new THREE.CircleGeometry(0.7, 32), wMat);
    wR.position.set(0.9, 0, -0.5); wR.rotation.y = -0.6;
    
    wingGroup.add(wL, wR);
    petGroup.add(wingGroup);
    equippedMeshes["wings"] = wingGroup;
  }
}

// ================= UI & API =================
function updateUI() {
  document.getElementById("ui-coins").innerText = state.coins;
  document.getElementById("ui-cases").innerText = state.cases;
  document.getElementById("ui-log").innerText = state.lastAction || "Выбери предмет в инвентаре!";

  var grid = document.getElementById("inv-grid");
  grid.innerHTML = "";
  
  var itemNames = {
    "hat_cap": "Кепка", "hat_top": "Цилиндр", "hat_crown": "Корона",
    "glass_sun": "Очки", "glass_cyber": "Визор",
    "wing_bat": "Демон", "wing_angel": "Ангел"
  };
  var itemIcons = {
    "hat_cap": "🧢", "hat_top": "🎩", "hat_crown": "👑",
    "glass_sun": "🕶️", "glass_cyber": "🥽",
    "wing_bat": "🦇", "wing_angel": "🦋"
  };

  // Убираем дубликаты из инвентаря для отображения
  var uniqueInv = [];
  state.inventory.forEach(function(item) {
    if (uniqueInv.indexOf(item) === -1) uniqueInv.push(item);
  });

  uniqueInv.forEach(function(itemId) {
    var div = document.createElement("div");
    div.className = "inv-item";
    
    var isEq = false;
    for(var k in state.equipped) {
      if (state.equipped[k] === itemId) isEq = true;
    }
    if (isEq) div.classList.add("equipped");

    div.innerHTML = "<div style='font-size:24px'>" + (itemIcons[itemId] || "❓") + "</div>" + (itemNames[itemId] || itemId);
    div.onclick = function() { equipItem(itemId); };
    grid.appendChild(div);
  });

  // Обновляем 3D модель с новой экипировкой
  if (typeof update3DPet === "function") update3DPet();
}

function switchTab(tab, btn) {
  document.querySelectorAll(".tab-btn").forEach(function(b){ b.classList.remove("active"); });
  document.querySelectorAll(".content").forEach(function(c){ c.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("content-" + tab).classList.add("active");
}

function apiCall(action, extra) {
  var bodyData = { action: action, userId: me.id };
  if (extra) for (var k in extra) bodyData[k] = extra[k];

  fetch(API + "?chat_id=" + chatId, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(bodyData)
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d.ok && d.message && tg) tg.showAlert(d.message);
    if(d.state) { state = d.state; updateUI(); }
  })
  .catch(function(e){ if(tg) tg.showAlert("Ошибка сети"); });
}

function openCase() {
  if (state.cases <= 0) return tg.showAlert("Купи кейс!");
  if (state.coins < 100) return tg.showAlert("Мало монет!");

  var modal = document.getElementById("case-modal");
  var box = document.getElementById("case-box");
  var txt = document.getElementById("drop-text");
  
  modal.style.display = "flex";
  txt.style.opacity = 0;
  box.style.animation = "shake 0.2s infinite";

  // Делаем запрос
  apiCall("open_case", {});

  // Анимация
  setTimeout(function() {
    box.style.animation = "none";
    box.style.transform = "scale(1.3)";
    box.innerText = "💥";
    
    setTimeout(function() {
      box.innerText = "🎁";
      txt.innerText = state.lastAction;
      txt.style.opacity = 1;

      setTimeout(function() {
        modal.style.display = "none";
        box.style.transform = "scale(1)";
      }, 1500);
    }, 500);
  }, 1000);
}

function buyCase() { apiCall("buy_case", {}); }
function equipItem(id) { apiCall("equip", { itemId: id }); }

// Запуск
init3D();
apiCall("init"); // Первая загрузка

// Ресайз
window.addEventListener("resize", function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
