<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Тамагочи 2.0</title>
  <script src="https://telegram.org"></script>
  <script src="https://adsgram.ai"></script>
  <style>
    :root {
      --bg: #12141d;
      --card: #1e2230;
      --accent: #6c5ce7;
      --gold: #fdcb6e;
      --text: #ffffff;
      --sub: #a4b0be;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    .header {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      padding: 12px 16px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .level-badge {
      background: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }
    .room {
      width: 100%;
      max-width: 400px;
      height: 260px;
      background: radial-gradient(circle at center, #2c324a 0%, #181b26 100%);
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      overflow: hidden;
    }
    .pet-avatar {
      width: 130px;
      height: 130px;
      background: linear-gradient(135deg, #ff9ff3, #f368e0);
      border-radius: 45% 45% 40% 40%;
      position: relative;
      animation: breathe 3s ease-in-out infinite;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 15px 30px rgba(243, 104, 224, 0.3);
    }
    .pet-avatar:active { transform: scale(0.9); }
    .pet-avatar.jump { animation: jump 0.5s ease; }
    .ear {
      width: 34px;
      height: 45px;
      background: #f368e0;
      border-radius: 50% 50% 0 0;
      position: absolute;
      top: -22px;
    }
    .ear.left { left: 16px; transform: rotate(-15deg); }
    .ear.right { right: 16px; transform: rotate(15deg); }
    .eyes {
      display: flex;
      justify-content: space-between;
      width: 64px;
      position: absolute;
      top: 48px;
      left: 33px;
    }
    .eye {
      width: 14px;
      height: 18px;
      background: #12141d;
      border-radius: 50%;
      position: relative;
      animation: blink 4s infinite;
    }
    .eye::after {
      content: '';
      width: 5px;
      height: 5px;
      background: #fff;
      border-radius: 50%;
      position: absolute;
      top: 3px;
      left: 3px;
    }
    .mouth {
      width: 22px;
      height: 10px;
      border-bottom: 4px solid #12141d;
      border-radius: 0 0 20px 20px;
      position: absolute;
      top: 76px;
      left: 54px;
    }
    .mouth.sad {
      border-bottom: none;
      border-top: 4px solid #12141d;
      border-radius: 20px 20px 0 0;
      top: 80px;
    }
    .status-bubble {
      position: absolute;
      top: 14px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }
    .last-action {
      position: absolute;
      bottom: 12px;
      font-size: 12px;
      color: var(--sub);
    }
    .stats {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      padding: 16px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    .stat-row { margin-bottom: 12px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .bar-bg {
      width: 100%;
      height: 10px;
      background: #12141d;
      border-radius: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .actions {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    button {
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      background: var(--card);
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.96); }
    .btn-feed { background: #00b894; }
    .btn-play { background: #0984e3; }
    .btn-gold {
      grid-column: span 2;
      background: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
      color: #12141d;
    }
    @keyframes breathe {
      0%, 100% { transform: scaleY(1) translateY(0); }
      50% { transform: scaleY(1.04) translateY(-4px); }
    }
    @keyframes blink {
      0%, 96%, 100% { transform: scaleY(1); }
      98% { transform: scaleY(0.1); }
    }
    @keyframes jump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-25px); }
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div style="font-weight: bold; font-size: 18px;" id="petName">Пушистик</div>
      <div style="font-size: 12px; color: var(--sub);" id="xpText">Опыт: 0 / 100 XP</div>
    </div>
    <div class="level-badge" id="levelBadge">Ур. 1</div>
  </div>

  <div class="room">
    <div class="status-bubble" id="moodText">😺 Загрузка...</div>
    <div class="pet-avatar" id="petAvatar" onclick="animateJump()">
      <div class="ear left"></div>
      <div class="ear right"></div>
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth" id="petMouth"></div>
    </div>
    <div class="last-action" id="lastAction">Синхронизация...</div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <div class="stat-label"><span>🍖 Сытость</span><span id="hungerVal">80%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="hungerBar" style="width: 80%; background: #00b894;"></div></div>
    </div>
    <div class="stat-row">
      <div class="stat-label"><span>❤️ Настроение</span><span id="happyVal">80%</span></div>
      <div class="bar-bg"><div class="bar-fill" id="happyBar" style="width: 80%; background: #ff7675;"></div></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-feed" onclick="sendAction('feed')">🍖 Покормить</button>
    <button class="btn-play" onclick="sendAction('play')">🎾 Поиграть</button>
    <button class="btn-gold" onclick="watchAdForGold()">✨ Золотой корм (Смотреть рекламу)</button>
  </div>

  <script>
    const API_URL = "https://workers.dev";
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Инициализация рекламы AdsGram с вашим blockId
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "56776" }) : null;

    // Определяем ID чата (из параметра ссылки или личного ID пользователя)
    const urlParams = new URLSearchParams(window.location.search);
    const startParam = tg.initDataUnsafe?.start_param;
    let chatId = urlParams.get("chat_id") || (startParam ? startParam.replace("chat_", "") : null) || tg.initDataUnsafe?.user?.id || "demo_chat";

    const user = tg.initDataUnsafe?.user || { id: "guest", first_name: "Игрок" };

    async function loadPet() {
      try {
        const res = await fetch(`${API_URL}?chat_id=${chatId}`);
        const data = await res.json();
        if (data.pet) renderPet(data.pet);
      } catch (e) {
        document.getElementById("lastAction").innerText = "Ошибка связи с сервером";
      }
    }

    async function sendAction(action) {
      animateJump();
      try {
        const res = await fetch(`${API_URL}?chat_id=${chatId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: action,
            userId: user.id,
            userName: user.first_name
          })
        });
        const data = await res.json();
        if (!data.ok && data.message) {
          tg.showAlert(data.message);
        }
        if (data.pet) renderPet(data.pet);
      } catch (e) {
        tg.showAlert("Не удалось выполнить действие");
      }
    }

    function watchAdForGold() {
      if (!AdController) {
        // Если запущено вне Telegram для теста — сразу даем бонус
        sendAction("golden_feed");
        return;
      }
      AdController.show().then((result) => {
        // Пользователь досмотрел рекламу до конца
        sendAction("golden_feed");
        tg.showAlert("🎉 Питомец съел Золотой корм! Сытость и настроение 100%!");
      }).catch((err) => {
        tg.showAlert("Реклама сейчас недоступна или закрыта раньше времени.");
      });
    }

    function renderPet(pet) {
      document.getElementById("petName").innerText = pet.name;
      document.getElementById("levelBadge").innerText = `Ур. ${pet.level}`;
      document.getElementById("xpText").innerText = `Опыт: ${pet.xp} / ${pet.level * 100} XP`;
      document.getElementById("lastAction").innerText = pet.lastActionBy;

      document.getElementById("hungerVal").innerText = `${pet.hunger}%`;
      document.getElementById("hungerBar").style.width = `${pet.hunger}%`;

      document.getElementById("happyVal").innerText = `${pet.happiness}%`;
      document.getElementById("happyBar").style.width = `${pet.happiness}%`;

      const mouth = document.getElementById("petMouth");
      const mood = document.getElementById("moodText");

      if (pet.hunger < 30 || pet.happiness < 30) {
        mouth.classList.add("sad");
        mood.innerText = pet.hunger < 30 ? "😿 Очень хочу кушать!" : "😾 Мне скучно...";
        } else {
mouth.classList.remove("sad");
mood.innerText = "😺 Отличное настроение!";
}
}
function animateJump() {
const el = document.getElementById("petAvatar");
el.classList.remove("jump");
void el.offsetWidth;
el.classList.add("jump");
}
loadPet();
      </script>
</body>
</html>
